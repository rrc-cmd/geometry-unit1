<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Study Guide – Sections 1.1 to 1.4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#10131a;--surface:#181c25;--surface2:#212634;--border:#2d3345;--text:#e9ecf3;--muted:#8d95a8;
--c11:#4fc3f7;--c12:#a78bfa;--c13:#34d399;--c14:#fb923c;--acc:#4fc3f7;--good:#34d399;--bad:#f87171;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16.5px;line-height:1.65;min-height:100vh}
h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#nav{position:sticky;top:0;z-index:50;background:rgba(16,19,26,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:8px;padding:0 18px;height:56px;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.logo{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;white-space:nowrap;margin-right:6px}
.nb{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:20px;font-size:13.5px;white-space:nowrap;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500}
.nb:hover{color:var(--text);border-color:#4a5168}
.nb.on{color:#10131a;border-color:transparent;background:var(--c,var(--text))}
#main{max-width:820px;margin:0 auto;padding:30px 18px 90px}
.hero{padding:18px 0 10px}
.hero h1{font-size:clamp(30px,5vw,44px);margin-bottom:8px}
.hero p{color:var(--muted);max-width:60ch}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 30px}
.howto div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.howto b{display:block;font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;margin-bottom:2px}
.howto span{color:var(--muted);font-size:14px}
.seccards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sc{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:var(--r);padding:18px;text-align:left;width:100%}
.sc:hover{background:var(--surface2)}
.sc .id{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;color:var(--c);font-size:26px}
.sc h3{font-size:18px;margin:2px 0 4px}
.sc p{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--surface2);border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.small{font-size:13px;color:var(--muted);margin-top:5px}
.wide{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sechead{border-left:6px solid var(--c);padding:6px 0 6px 16px;margin-bottom:20px}
.sechead .id{color:var(--c);font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:15px}
.sechead h2{font-size:clamp(26px,4vw,34px)}
.tabs{display:flex;gap:8px;margin-bottom:26px;position:sticky;top:56px;background:var(--bg);padding:10px 0;z-index:40}
.tab{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;color:var(--muted)}
.tab.on{background:var(--c);color:#10131a;border-color:transparent}
.topic{margin-bottom:34px}
.topic h3{font-size:22px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.topic h3 .n{color:var(--c);font-size:15px}
.content p{margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px;background:var(--surface);border-radius:10px;overflow:hidden}
.tbl th{background:var(--surface2);text-align:left;padding:8px 10px;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600}
.tbl td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
.rule{background:color-mix(in srgb,var(--c) 14%,transparent);border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;margin:10px 0}
.tip{background:#2a2414;border-left:4px solid #facc15;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:15px}
.tip::before{content:'💡 ';}
.ex{background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15.5px}
.big{font-family:'Space Grotesk',system-ui,sans-serif;font-size:21px;font-weight:600;text-align:center;background:var(--surface);border-radius:10px;padding:14px;margin:12px 0}
.steps-list{margin:8px 0 12px 22px}
.steps-list li{margin-bottom:4px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card.ok{border-color:var(--good)}.card.no{border-color:var(--bad)}
.chk-label{font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--c);margin-bottom:6px}
.qtext{font-weight:500;margin-bottom:12px;font-size:16.5px}
.qnum{font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.chip{font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--c);color:#10131a;font-weight:700}
.fig{background:#fff;border-radius:10px;padding:10px;margin:0 0 14px;text-align:center}
.fig img,.fig svg{max-width:100%;height:auto;display:inline-block;vertical-align:middle}
.fig img{max-height:320px}
.choices{display:grid;gap:8px}
.ch{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.ch:hover:not(:disabled){border-color:var(--c)}
.ch .L{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;color:var(--muted);min-width:18px}
.ch.right{border-color:var(--good);background:rgba(52,211,153,.13)}
.ch.wrong{border-color:var(--bad);background:rgba(248,113,113,.13)}
.ch:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.fld label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:3px;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600}
.fld input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:16px}
.fld input.right{border-color:var(--good)}.fld input.wrong{border-color:var(--bad)}
.fld .corr{font-size:13px;color:var(--good);margin-top:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--c);color:#10131a;border:none;border-radius:9px;padding:9px 18px;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--border);font-weight:600}
.msg{margin-top:12px;font-weight:600}
.msg.ok{color:var(--good)}.msg.no{color:var(--bad)}
.sol{margin-top:14px;background:var(--bg);border-radius:10px;padding:14px 16px;border-left:4px solid var(--c)}
.sol-h{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;margin-bottom:6px}
.sol ol{margin-left:22px}
.sol li{margin-bottom:5px}
.sol-ans{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sol .fig{margin-top:12px;margin-bottom:0}
.why{margin-top:10px;font-size:15px}
.setbox{margin-bottom:34px}
.setbox h3{font-size:21px;margin-bottom:4px}
.setnote{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.scorebar{position:sticky;top:56px;z-index:40;background:var(--bg);padding:10px 0;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.scorebar b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:18px}
.result{background:var(--surface);border:2px solid var(--c);border-radius:var(--r);padding:20px;margin-top:10px}
.result h3{font-size:24px;margin-bottom:10px}
.rrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border)}
.testlist{display:grid;gap:12px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fc{perspective:900px;height:170px;background:none;border:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb2{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px;text-align:center}
.fc .fa{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--c)}
.fc .fa b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:20px}
.fc .fa span{font-size:12px;color:var(--muted);margin-top:6px}
.fc .fb2{background:var(--surface2);border:1px solid var(--c);transform:rotateY(180deg);font-size:15px}
/* geometry notation */
.ov{position:relative;display:inline-block;padding-top:.42em;line-height:1;font-style:italic;font-family:Georgia,serif;
 background:linear-gradient(currentColor,currentColor) no-repeat;background-size:100% 1.5px;background-position:0 .2em}
.ov.ray::after,.ov.line::after,.ov.line::before{content:'';position:absolute;top:calc(.2em - 3.2px);border-top:3.9px solid transparent;border-bottom:3.9px solid transparent}
.ov.ray::after,.ov.line::after{right:-3px;border-left:6px solid currentColor}
.ov.line::before{left:-3px;border-right:6px solid currentColor}
.ov.ray,.ov.line{padding-right:2px}
@media (max-width:640px){.howto,.seccards,.wide{grid-template-columns:1fr}.tf{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}
</style>
</head>

<main id="main"></main>
<script type="application/json" id="gd">{"sections": [{"id": "1.1", "title": "Points, Lines, and Planes", "color": "#4fc3f7", "blurb": "Naming, collinear vs. coplanar, rays, intersections", "topics": [{"h": "The three building blocks", "body": "\n<p>Geometry starts with three words that are never formally defined. You just have to know what they look like and how to name them.<\/p>\n<table class=\"tbl\"><tr><th>Term<\/th><th>Picture<\/th><th>How to name it<\/th><\/tr>\n<tr><td><b>Point<\/b><\/td><td>A dot. It has no size.<\/td><td>One capital letter: point <i>A<\/i><\/td><\/tr>\n<tr><td><b>Line<\/b><\/td><td>Straight, with arrows on both ends. It goes on forever both ways.<\/td><td>Any 2 points on it, <b>in any order<\/b>: <span class=\"ov line\">AB<\/span> or <span class=\"ov line\">BA<\/span>. Or a lowercase letter: line <i>f<\/i><\/td><\/tr>\n<tr><td><b>Plane<\/b><\/td><td>A flat surface (drawn like a tilted sheet of paper). It goes on forever.<\/td><td>3 points that are <b>not on the same line<\/b>: plane <i>ABC<\/i>. Or one capital letter written on it: plane <i>V<\/i><\/td><\/tr><\/table>\n<div class=\"tip\">Why 3 points for a plane? Any 3 points that aren't in a straight line lock in exactly one flat surface. Think of a camera tripod: 3 legs never wobble.<\/div>", "chk": {"q": "What is the fewest number of points you need to name a plane?", "choices": ["1", "2", "3 that are not on the same line", "4"], "ans": 2, "why": "A plane needs 3 points that are not all on one line (noncollinear). Or you can use its single capital letter, like plane V.", "type": "check"}}, {"h": "Collinear and coplanar", "body": "\n<p><b>Collinear<\/b> points lie on the same line. <b>Coplanar<\/b> points lie in the same plane.<\/p>\n<p>Two rules your teacher keeps coming back to:<\/p>\n<div class=\"rule\"><b>Any 2 points<\/b> are always collinear. You can always draw a line through two points.<\/div>\n<div class=\"rule\"><b>Any 3 points<\/b> are always coplanar. \"3 points ALWAYS form a plane.\"<\/div>\n<p>The trap is in true/false questions. If three points are <b>not<\/b> on a line that's drawn in the diagram, they are <b>not collinear<\/b>, even though they are still coplanar. That's how the Station 3 key handles it:<\/p>\n<div class=\"ex\">\"Points J, N, and B are collinear.\" <b>False<\/b>. No line is drawn through them. But they <i>are<\/i> coplanar, because 3 points always are.<\/div>\n<p><b>Noncollinear<\/b> = not all on one line. <b>Noncoplanar<\/b> = not all in one plane (you need at least 4 points for this).<\/p>", "chk": {"q": "No line is drawn through points X, Y, and Z. Which is true?", "choices": ["They are collinear and coplanar", "They are coplanar but not collinear", "They are collinear but not coplanar", "They are neither"], "ans": 1, "why": "Three points are always coplanar. With no line drawn through all three, they are not collinear.", "type": "check"}}, {"h": "Segments, rays, and opposite rays", "body": "\n<table class=\"tbl\"><tr><th>Name<\/th><th>What it is<\/th><th>Symbol<\/th><\/tr>\n<tr><td><b>Segment<\/b><\/td><td>Part of a line with <b>two endpoints<\/b>. It stops at both ends.<\/td><td><span class=\"ov seg\">AB<\/span> (bar on top, order doesn't matter)<\/td><\/tr>\n<tr><td><b>Ray<\/b><\/td><td>Starts at <b>one endpoint<\/b> and goes forever in one direction.<\/td><td><span class=\"ov ray\">AB<\/span> starts at A and goes through B<\/td><\/tr>\n<tr><td><b>Opposite rays<\/b><\/td><td>Two rays with the <b>same endpoint<\/b> that point in <b>opposite directions<\/b>. Together they make a line.<\/td><td><span class=\"ov ray\">QR<\/span> and <span class=\"ov ray\">QP<\/span><\/td><\/tr><\/table>\n<div class=\"rule\">For a ray, the <b>first letter is always the endpoint<\/b>. <span class=\"ov ray\">AB<\/span> and <span class=\"ov ray\">BA<\/span> are different rays.<\/div>\n<div class=\"rule\">Two ray names are the <b>same ray<\/b> if they have the same starting point and go the same direction. On line <i>f<\/i> in Station 1, <span class=\"ov ray\">SR<\/span>, <span class=\"ov ray\">SQ<\/span>, and <span class=\"ov ray\">SP<\/span> are all the same ray.<\/div>\n<div class=\"tip\">Checking opposite rays: 1) Same first letter? 2) Pointing opposite ways along one line? Both must be yes. <span class=\"ov ray\">MN<\/span> and <span class=\"ov ray\">NM<\/span> fail step 1, so they are not opposite.<\/div>", "chk": {"q": "Points M, G, N are on a line in that order. Which pair are opposite rays?", "choices": ["<span class=\"ov ray\">MN<\/span> and <span class=\"ov ray\">NM<\/span>", "<span class=\"ov ray\">GM<\/span> and <span class=\"ov ray\">GN<\/span>", "<span class=\"ov ray\">MG<\/span> and <span class=\"ov ray\">GN<\/span>", "<span class=\"ov ray\">GM<\/span> and <span class=\"ov ray\">NM<\/span>"], "ans": 1, "why": "Opposite rays need the same starting point. <span class=\"ov ray\">GM<\/span> and <span class=\"ov ray\">GN<\/span> both start at G and point in opposite directions.", "type": "check"}}, {"h": "How many names can one thing have?", "body": "\n<p>Lots of questions say \"state two other names for...\" Here is how to find every option.<\/p>\n<div class=\"ex\"><b>A line:<\/b> pick any 2 of its points, in either order. Line <i>f<\/i> in Station 1 goes through R, Q, P, S, so it has 12 two-letter names: <span class=\"ov line\">RQ<\/span>, <span class=\"ov line\">QR<\/span>, <span class=\"ov line\">RP<\/span>, <span class=\"ov line\">PR<\/span>, <span class=\"ov line\">RS<\/span>, <span class=\"ov line\">SR<\/span>, <span class=\"ov line\">QP<\/span>, <span class=\"ov line\">PQ<\/span>, <span class=\"ov line\">QS<\/span>, <span class=\"ov line\">SQ<\/span>, <span class=\"ov line\">PS<\/span>, <span class=\"ov line\">SP<\/span>.<\/div>\n<div class=\"ex\"><b>A plane:<\/b> pick any 3 of its points as long as they're <b>not all on the same line<\/b>. Plane RQT can also be plane V, plane RPT, plane RST, plane PQT, plane SQT... but NOT plane RQP (R, Q, P are all on line <i>f<\/i>).<\/div>\n<div class=\"ex\"><b>A ray:<\/b> keep the same endpoint first, then use any other point in that direction.<\/div>", "chk": {"q": "Points R, Q, P, S are all on line f, and T is in plane V but not on line f. Which is NOT a correct name for plane V?", "choices": ["Plane RQT", "Plane PST", "Plane RQS", "Plane QPT"], "ans": 2, "why": "R, Q, and S are all on line f. Three collinear points don't pin down one plane, so \"plane RQS\" isn't allowed. The other choices each include T, which is off the line.", "type": "check"}}, {"h": "Intersections and drawing", "body": "\n<p>The <b>intersection<\/b> is where figures meet, the points they have in common.<\/p>\n<table class=\"tbl\"><tr><th>These meet...<\/th><th>...in a<\/th><\/tr>\n<tr><td>Two lines<\/td><td><b>point<\/b><\/td><\/tr>\n<tr><td>A line and a plane (line not lying in the plane)<\/td><td><b>point<\/b><\/td><\/tr>\n<tr><td>Two planes<\/td><td><b>line<\/b><\/td><\/tr><\/table>\n<div class=\"tip\">From your homework key: \"lines &amp; planes intersect at a point\" and \"planes intersect at lines.\" Two planes never meet at just one point.<\/div>\n<p><b>Drawing tips<\/b> from the Station 2 key: draw planes like parallelograms, give lines arrows on both ends, and use <b>dashed lines<\/b> for any part that's hidden behind or under a plane. \"Careful with dashed lines!\"<\/p>", "chk": {"q": "Two planes intersect. What does their intersection look like?", "choices": ["A point", "A line", "A ray", "Two points"], "ans": 1, "why": "Two planes always intersect in a line (if they intersect at all).", "type": "check"}}], "sets": [{"title": "Station 1: Naming", "note": "Use the diagram for every question in this set.", "img": "st1", "probs": [{"type": "mc", "q": "1. Which is another name for line <i>f<\/i>?", "choices": ["<span class=\"ov ray\">QS<\/span>", "<span class=\"ov line\">QS<\/span>", "<span class=\"ov line\">QT<\/span>", "<span class=\"ov line\">WU<\/span>"], "ans": 1, "steps": ["Line <i>f<\/i> passes through R, Q, P, and S.", "A line is named by any two of its points with a double arrow on top.", "<span class=\"ov ray\">QS<\/span> has a one-way arrow, so it's a ray, not a line. T is not on line <i>f<\/i>. W and U are on line <i>g<\/i>."], "answer": "Any two of R, Q, P, S: <span class=\"ov line\">RQ<\/span>, <span class=\"ov line\">RP<\/span>, <span class=\"ov line\">RS<\/span>, <span class=\"ov line\">QR<\/span>, <span class=\"ov line\">QP<\/span>, <span class=\"ov line\">QS<\/span>, <span class=\"ov line\">PR<\/span>, <span class=\"ov line\">PQ<\/span>, <span class=\"ov line\">PS<\/span>, <span class=\"ov line\">SR<\/span>, <span class=\"ov line\">SQ<\/span>, <span class=\"ov line\">SP<\/span>", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "2. Which is another name for plane RQT?", "choices": ["Plane RQP", "Plane WQT", "Plane V", "Plane RQS"], "ans": 2, "steps": ["Plane RQT is the shaded plane, labeled V.", "To name it with points, use 3 of its points that are NOT on one line. That means two of R, Q, P, S plus T (T is the only point off line <i>f<\/i>).", "RQP and RQS are all on line <i>f<\/i>. W is not in the plane."], "answer": "Plane V, plane RPT, plane RST, plane PQT, plane SQT, and so on", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "3. Which is another name for <span class=\"ov ray\">SR<\/span>?", "choices": ["<span class=\"ov ray\">RS<\/span>", "<span class=\"ov ray\">SQ<\/span>", "<span class=\"ov ray\">QS<\/span>", "<span class=\"ov ray\">PR<\/span>"], "ans": 1, "steps": ["<span class=\"ov ray\">SR<\/span> starts at S and goes left through P, Q, R.", "Keep the same starting point (S) and pick another point in that direction.", "<span class=\"ov ray\">SQ<\/span> and <span class=\"ov ray\">SP<\/span> are the same ray: same start, same direction."], "answer": "<span class=\"ov ray\">SQ<\/span> and <span class=\"ov ray\">SP<\/span>", "img": "st1", "svg": null, "sec": null}, {"type": "show", "q": "4. State three pairs of opposite rays.", "answer": "<span class=\"ov ray\">QW<\/span> &amp; <span class=\"ov ray\">QU<\/span>, <span class=\"ov ray\">QR<\/span> &amp; <span class=\"ov ray\">QP<\/span> (or <span class=\"ov ray\">QS<\/span>), <span class=\"ov ray\">PS<\/span> &amp; <span class=\"ov ray\">PQ<\/span> (or <span class=\"ov ray\">PR<\/span>)", "steps": ["Opposite rays share an endpoint and point opposite ways along one line.", "Q is on line <i>g<\/i> between W and U, so <span class=\"ov ray\">QW<\/span> and <span class=\"ov ray\">QU<\/span> are opposite.", "Q is also on line <i>f<\/i> between R and P, so <span class=\"ov ray\">QR<\/span> and <span class=\"ov ray\">QP<\/span> are opposite. <span class=\"ov ray\">QS<\/span> is the same ray as <span class=\"ov ray\">QP<\/span>.", "P is between Q and S, so <span class=\"ov ray\">PQ<\/span> and <span class=\"ov ray\">PS<\/span> are opposite."], "img": "st1", "svg": null, "reveal_img": null, "sec": null}, {"type": "mc", "q": "5. Which three points are collinear?", "choices": ["W, Q, P", "W, Q, U", "R, Q, T", "P, S, T"], "ans": 1, "steps": ["Collinear means on the same drawn line.", "W, Q, and U are all on line <i>g<\/i>.", "Any 3 of R, Q, P, S would also work (line <i>f<\/i>)."], "answer": "W, Q, U, or any 3 of R, Q, P, S", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "6. Which four points are coplanar?", "choices": ["W, R, S, T", "W, Q, P, T", "R, Q, S, T", "U, R, P, T"], "ans": 2, "steps": ["Look for points that are all in plane V: R, Q, P, S, T.", "R, Q, S, T are all in plane V.", "Another set that works: W, Q, U, P (line <i>g<\/i> and line <i>f<\/i> lie in the same plane, plane WQP)."], "answer": "Any 4 of R, Q, P, S, T (W, Q, U, P also works)", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "7. Which three points are noncollinear?", "choices": ["R, Q, T", "W, Q, U", "R, P, S", "Q, P, S"], "ans": 0, "steps": ["Noncollinear = not all on one line.", "R and Q are on line <i>f<\/i>, but T is not. So R, Q, T are noncollinear.", "The key's rule: any 3 points, as long as they aren't all on line <i>g<\/i> or all on line <i>f<\/i>."], "answer": "Any 3 points not all on line g or all on line f, like R, Q, T", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "8. Which four points are noncoplanar?", "choices": ["R, Q, P, T", "R, Q, S, T", "W, Q, U, P", "W, Q, P, T"], "ans": 3, "steps": ["W, Q, and P lie in one plane (the plane holding lines <i>g<\/i> and <i>f<\/i>).", "T is in plane V but not on line <i>f<\/i>, so T is not in plane WQP.", "So W, Q, P, T can't all fit in one plane.", "The key also accepts U, R, P, T."], "answer": "Example: W, Q, P, T or U, R, P, T", "img": "st1", "svg": null, "sec": null}, {"type": "mc", "q": "9. Which is another name for plane WQP?", "choices": ["Plane V", "Plane WQU", "Plane WQR", "Plane WQT"], "ans": 2, "steps": ["Plane WQP is not drawn, but it exists: it contains all of line <i>g<\/i> and all of line <i>f<\/i>.", "R is on line <i>f<\/i>, so R is in plane WQP. W, Q, R aren't on one line, so \"plane WQR\" works.", "WQU is on one line (no good). T is not on line <i>f<\/i> or <i>g<\/i>."], "answer": "Plane WQR, plane WUS, plane WRU, plane QPU, and so on", "img": "st1", "svg": null, "sec": null}]}, {"title": "Station 2: Drawing", "note": "Draw each one on paper first. Then check it against your teacher's drawing. \"Drawings may differ slightly!\"", "probs": [{"type": "show", "q": "1. Draw and label line <i>m<\/i> intersecting plane GEO at point G.", "answer": "A plane with points G, E, O in it, and line <i>m<\/i> passing through the plane at G.", "steps": ["Draw a parallelogram for the plane and put points E, O, and G in it.", "Draw line <i>m<\/i> going through point G, with arrows on both ends.", "The part of line <i>m<\/i> below the plane is hidden, so draw it dashed."], "img": null, "svg": null, "reveal_img": "st2k1", "sec": null}, {"type": "show", "q": "2. Draw and label line <i>k<\/i> on plane MHS.", "answer": "A plane with points M, H, S, and line <i>k<\/i> lying flat inside it.", "steps": ["Draw the plane and put points M, H, and S in it (not all in a row).", "Draw line <i>k<\/i> completely inside the plane, with arrows on both ends."], "img": null, "svg": null, "reveal_img": "st2k2", "sec": null}, {"type": "show", "q": "3. Draw opposite rays <span class=\"ov ray\">JK<\/span> and <span class=\"ov ray\">JL<\/span> so that <span class=\"ov ray\">JK<\/span> can also be named <span class=\"ov ray\">JP<\/span>.", "answer": "A line with points in the order K, P, J, L (K and P can switch).", "steps": ["Opposite rays share endpoint J, so J goes in the middle with K on one side and L on the other.", "For <span class=\"ov ray\">JK<\/span> to also be called <span class=\"ov ray\">JP<\/span>, P has to be on the same side of J as K.", "So the order is K, P, J, L (or P, K, J, L)."], "img": null, "svg": null, "reveal_img": "st2k3", "sec": null}, {"type": "show", "q": "4. Challenge: Draw plane ABD intersecting plane DOG at <span class=\"ov line\">CD<\/span>.", "answer": "Two planes crossing each other; the crossing line goes through C and D.", "steps": ["Two planes intersect in a line, and here that line is <span class=\"ov line\">CD<\/span>. Draw that line first.", "Draw one plane containing A and B (and the line). Draw the second plane cutting through it, containing O and G.", "Use dashed lines for edges hidden behind the other plane. \"Careful with dashed lines!\""], "img": null, "svg": null, "reveal_img": "st2k4", "sec": null}]}, {"title": "Station 3: True or False", "note": "If a statement is false, figure out how to fix it before you check.", "img": "st3", "probs": [{"type": "mc", "q": "1. Points J, N, and B are collinear.", "choices": ["True", "False"], "ans": 1, "steps": ["No line is drawn through J, N, and B.", "Fix: they ARE coplanar, because 3 points always are."], "answer": "False. No line is drawn through them. They are coplanar.", "img": "st3", "svg": null, "sec": null}, {"type": "mc", "q": "2. Points J, N, and B are coplanar.", "choices": ["True", "False"], "ans": 0, "steps": ["Any 3 points always form a plane."], "answer": "True. 3 points ALWAYS form a plane.", "img": "st3", "svg": null, "sec": null}, {"type": "mc", "q": "3. <span class=\"ov ray\">MN<\/span> and <span class=\"ov ray\">NM<\/span> are opposite rays.", "choices": ["True", "False"], "ans": 1, "steps": ["Opposite rays must start at the same point. <span class=\"ov ray\">MN<\/span> starts at M and <span class=\"ov ray\">NM<\/span> starts at N.", "Fix: G is between M and N, so <span class=\"ov ray\">GN<\/span> and <span class=\"ov ray\">GM<\/span> are opposite rays."], "answer": "False. Not the same starting point. <span class=\"ov ray\">GN<\/span> and <span class=\"ov ray\">GM<\/span> are opposite rays.", "img": "st3", "svg": null, "sec": null}, {"type": "mc", "q": "4. All points on <span class=\"ov ray\">BE<\/span> and <span class=\"ov ray\">BG<\/span> are coplanar.", "choices": ["True", "False"], "ans": 0, "steps": ["Both rays start at B. Points E, B, and G are 3 points, so they make one plane.", "Both rays lie in that plane."], "answer": "True. E, B, and G are coplanar (3 points).", "img": "st3", "svg": null, "sec": null}, {"type": "mc", "q": "5. The intersection of plane K and plane L is <span class=\"ov ray\">DC<\/span>.", "choices": ["True", "False"], "ans": 1, "steps": ["Two planes intersect in a line, and the line where planes K and L cross runs from M to N.", "<span class=\"ov ray\">DC<\/span> is a ray inside plane L, not the crossing line."], "answer": "False. The intersection of plane K and plane L is <span class=\"ov line\">MN<\/span>.", "img": "st3", "svg": null, "sec": null}, {"type": "mc", "q": "6. <span class=\"ov line\">BF<\/span> lies on plane HAB.", "choices": ["True", "False"], "ans": 1, "steps": ["Plane HAB is plane K. Line BF goes up and down through it.", "A line that passes through a plane touches it at one point."], "answer": "False. <span class=\"ov line\">BF<\/span> intersects plane HAB at point B.", "img": "st3", "svg": null, "sec": null}, {"type": "show", "q": "Challenge: Name a LINE that exists but isn't drawn, and a PLANE that exists but isn't drawn.", "answer": "Many answers. Line example: <span class=\"ov line\">HJ<\/span>. Plane example: plane HJE.", "steps": ["Any 2 points make a line. Pick two points that don't already have a line drawn through them, like H and J.", "Any 3 noncollinear points make a plane. Pick 3 that aren't all in plane K or all in plane L, like H, J, and E."], "img": "st3", "svg": null, "reveal_img": null, "sec": null}]}, {"title": "Class notes: Do Now true or false", "note": "From the 9/11 notes. Planes S and R intersect. Lines a, b, c all pass through J.", "img": "n_dn", "probs": [{"type": "mc", "q": "a) Points N, K, and T are collinear.", "choices": ["True", "False"], "ans": 1, "steps": ["No line is drawn through N, K, and T.", "They are coplanar (all in plane R)."], "answer": "False. No line drawn. They are coplanar.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "b) Points Q and L are collinear.", "choices": ["True", "False"], "ans": 0, "steps": ["Any 2 points are always collinear. You can always draw a line through two points."], "answer": "True. Any 2 points are collinear.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "c) All points on <span class=\"ov ray\">JK<\/span> and <span class=\"ov ray\">NM<\/span> are coplanar.", "choices": ["True", "False"], "ans": 0, "steps": ["<span class=\"ov ray\">JK<\/span> is on line <i>c<\/i>, which lies in plane R.", "<span class=\"ov ray\">NM<\/span> is on line <i>b<\/i>, which also lies in plane R.", "Everything is in plane R."], "answer": "True. Both rays lie in plane R.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "d) <span class=\"ov ray\">QP<\/span> and <span class=\"ov ray\">PQ<\/span> are opposite rays.", "choices": ["True", "False"], "ans": 1, "steps": ["They don't start at the same point.", "Fix: J is between Q and P, so <span class=\"ov ray\">JQ<\/span> and <span class=\"ov ray\">JP<\/span> are opposite rays."], "answer": "False. Not the same starting point. <span class=\"ov ray\">JQ<\/span> and <span class=\"ov ray\">JP<\/span> are opposite rays.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "e) The intersection of plane S and plane R is point J.", "choices": ["True", "False"], "ans": 1, "steps": ["Two planes intersect in a line, not a point.", "The planes cross along line <i>b<\/i> (through M, J, N)."], "answer": "False. The intersection is line b (<span class=\"ov line\">MN<\/span>).", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "f) Points Q, J, and L are coplanar.", "choices": ["True", "False"], "ans": 0, "steps": ["3 points always form a plane."], "answer": "True. 3 points ALWAYS form a plane.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "g) Points Q, J, L, and N are coplanar.", "choices": ["True", "False"], "ans": 1, "steps": ["J, L, and N are all in plane R.", "Q is in plane S, above plane R, so it isn't in plane R.", "No single plane holds all four."], "answer": "False. Q is not in plane R, so the four points are noncoplanar.", "img": "n_dn", "svg": null, "sec": null}, {"type": "mc", "q": "h) <span class=\"ov line\">LK<\/span> intersects plane S at line <i>b<\/i>.", "choices": ["True", "False"], "ans": 1, "steps": ["A line and a plane meet at a point.", "<span class=\"ov line\">LK<\/span> is line <i>c<\/i>, which passes through plane S at J."], "answer": "False. <span class=\"ov line\">LK<\/span> intersects plane S at point J.", "img": "n_dn", "svg": null, "sec": null}]}, {"title": "1.1 Homework (Practice B)", "note": "Diagram redrawn from your homework sheet.", "svg": "<svg viewBox=\"0 0 360 270\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:360px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\" text x=\"214\" y=\"200\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">K<\/text><\/svg>", "reveal_img": null, "sec": null}]}]}, {"id": "1.2", "title": "Segments and Congruence", "color": "#a78bfa", "blurb": "Segment addition, congruent segments, algebra with segments", "topics": [{"h": "Length and distance", "body": "\n<p>Be careful with the symbols. They look alike but mean different things.<\/p>\n<table class=\"tbl\"><tr><th>You see<\/th><th>It means<\/th><\/tr>\n<tr><td><span class=\"ov seg\">AB<\/span><\/td><td>The segment itself (the object)<\/td><\/tr>\n<tr><td>AB (no bar)<\/td><td>The <b>length<\/b> of the segment, a number<\/td><\/tr><\/table>\n<p><b>Ruler Postulate:<\/b> the distance between two points on a number line is the <b>absolute value of the difference<\/b> of their coordinates. In plain words: subtract, and drop any negative sign. Or just count the spaces.<\/p>\n<div class=\"ex\">A is at −9 and D is at 0. AD = |0 − (−9)| = 9.<\/div>", "chk": {"q": "On a number line, B is at −6 and E is at 2. What is BE?", "choices": ["4", "−8", "8", "6"], "ans": 2, "why": "BE = |2 − (−6)| = |8| = 8. Distances are never negative.", "type": "check"}}, {"h": "Segment Addition Postulate", "body": "\n<p>If B is <b>between<\/b> A and C (on the same segment), then<\/p>\n<div class=\"big\">AB + BC = AC<\/div>\n<p>In words: <b>part + part = whole<\/b>. If you know the whole and one part, subtract to get the other part.<\/p>\n<div class=\"ex\">R 17 S 8.5 T. RT = 17 + 8.5 = <b>25.5<\/b>.<br>A to C is 54 and AB = 25. BC = 54 − 25 = <b>29<\/b>.<\/div>\n<div class=\"tip\">Your teacher's tip: <b>draw on the diagram before you answer anything<\/b>. Circle the numbers you're given and write every length you figure out right on the picture.<\/div>", "chk": {"q": "Point N is between M and P. MP = 32 and NP = 26. What is MN?", "choices": ["58", "6", "26", "16"], "ans": 1, "why": "Part + part = whole: MN + 26 = 32, so MN = 6.", "type": "check"}}, {"h": "Congruent segments", "body": "\n<p><b>Congruent segments<\/b> are segments that have the <b>same length<\/b>.<\/p>\n<table class=\"tbl\"><tr><th>Lengths are equal<\/th><th>Segments are congruent<\/th><\/tr>\n<tr><td>AB = CD<br><span class=\"muted\">\"is equal to\"<\/span><\/td><td><span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span><br><span class=\"muted\">\"is congruent to\"<\/span><\/td><\/tr><\/table>\n<div class=\"rule\">Use <b>=<\/b> between lengths (numbers). Use <b>≅<\/b> between segments (bars on top). Don't mix them.<\/div>\n<p>In diagrams, <b>tick marks<\/b> show congruent segments. Segments with one tick | match each other; segments with two ticks || match each other.<\/p>", "chk": {"q": "Which is written correctly?", "choices": ["AB ≅ CD", "<span class=\"ov seg\">AB<\/span> = <span class=\"ov seg\">CD<\/span>", "<span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span>", "AB ≅ <span class=\"ov seg\">CD<\/span>"], "ans": 2, "why": "Segments (with bars) get ≅. Lengths (no bars) get =. So <span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span> or AB = CD.", "type": "check"}}, {"h": "Segments on a coordinate plane", "body": "\n<p>For a <b>horizontal<\/b> segment (same y), subtract the x-values. For a <b>vertical<\/b> segment (same x), subtract the y-values. Or count the boxes on the graph.<\/p>\n<div class=\"ex\">A(2, 2) and B(4, 2): same y, so AB = 4 − 2 = 2.<br>C(−1, −1) and D(−1, 1): same x, so CD = 1 − (−1) = 2.<br>AB = CD, so <span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span>. <b>Yes, congruent.<\/b><\/div>", "chk": {"q": "M(1, −3) and N(4, −3). What is MN?", "choices": ["3", "5", "6", "0"], "ans": 0, "why": "Same y, so subtract x: 4 − 1 = 3.", "type": "check"}}, {"h": "Algebra with segments: the 4-step routine", "body": "\n<ol class=\"steps-list\">\n<li><b>Draw it<\/b> and label each part with its expression.<\/li>\n<li><b>Write the equation.<\/b> Part + part = whole. (For congruent segments: set the two lengths equal.)<\/li>\n<li><b>Solve for x.<\/b><\/li>\n<li><b>Plug x back in<\/b> to get the lengths the question asks for. The answer is almost never just x!<\/li><\/ol>\n<div class=\"ex\">AB = 7x + 2, BC = 2x − 1, AC = 64.<br>(7x + 2) + (2x − 1) = 64 → 9x + 1 = 64 → x = 7.<br>AB = 7(7) + 2 = <b>51<\/b>, BC = 2(7) − 1 = <b>13<\/b>. Check: 51 + 13 = 64 ✓<\/div>\n<div class=\"tip\">Always finish with the check: do your parts add up to the whole?<\/div>", "chk": {"q": "Q is between P and R. PQ = 2x, QR = 3x, PR = 25. What is QR?", "choices": ["5", "10", "15", "25"], "ans": 2, "why": "2x + 3x = 25, so x = 5. QR = 3(5) = 15. (x = 5 is a trap: the question asks for QR.)", "type": "check"}}], "sets": [{"title": "Class notes: On your own", "probs": [{"type": "num", "q": "3. P, Q, R, S are collinear. PS = 46, PR = 18, and PQ = QR. Find PQ, QR, QS, and RS.", "fields": [{"label": "PQ", "acc": ["9"]}, {"label": "QR", "acc": ["9"]}, {"label": "QS", "acc": ["37"]}, {"label": "RS", "acc": ["28"]}], "steps": ["PQ = QR and together they make PR = 18. Split it in half: PQ = QR = 9.", "QS = PS − PQ = 46 − 9 = 37.", "RS = PS − PR = 46 − 18 = 28.", "Check: 9 + 9 + 28 = 46 ✓"], "answer": "PQ = 9, QR = 9, QS = 37, RS = 28", "img": "n_pqrs", "svg": null, "sec": null}, {"type": "num", "q": "4. Find YZ.", "fields": [{"label": "x", "acc": ["3"]}, {"label": "YZ", "acc": ["8"]}], "steps": ["Part + part = whole: (2x + 3) + (3x − 1) = 8x − 7.", "Combine: 5x + 2 = 8x − 7.", "Subtract 5x from both sides: 2 = 3x − 7. Add 7: 9 = 3x, so x = 3.", "YZ = 3(3) − 1 = 8.", "Check: XY = 9, YZ = 8, XZ = 17 and 9 + 8 = 17 ✓"], "answer": "x = 3, YZ = 8", "img": "n_xyz", "svg": null, "sec": null}, {"type": "num", "q": "5. Draw a picture first! Find RS given that S is between R and T. RS = 2x + 10, ST = x − 4, RT = 21.", "fields": [{"label": "x", "acc": ["5"]}, {"label": "RS", "acc": ["20"]}], "steps": ["Draw R ——— S ——— T with RS = 2x + 10, ST = x − 4, and the whole RT = 21.", "Part + part = whole: (2x + 10) + (x − 4) = 21.", "3x + 6 = 21 → 3x = 15 → x = 5.", "RS = 2(5) + 10 = 20.", "Check: ST = 1, and 20 + 1 = 21 ✓"], "answer": "x = 5, RS = 20", "img": null, "svg": "<svg viewBox=\"0 0 380 106\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:380px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"24\" y1=\"70\" x2=\"356\" y2=\"70\" stroke=\"#111\" stroke-width=\"2.5\"/><circle cx=\"24\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"24\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">R<\/text><circle cx=\"273.0\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"273.0\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">S<\/text><circle cx=\"356\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"356\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">T<\/text><text x=\"148.5\" y=\"94\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">2x + 10<\/text><text x=\"314.5\" y=\"94\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">x − 4<\/text><line x1=\"24\" y1=\"36\" x2=\"356\" y2=\"36\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"24\" y1=\"29\" x2=\"24\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"356\" y1=\"29\" x2=\"356\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><rect x=\"174.0\" y=\"25\" width=\"32\" height=\"20\" fill=\"#fff\"/><text x=\"190.0\" y=\"41\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">21<\/text><\/svg>", "sec": null}, {"type": "num", "q": "1.2 Wrap up: <span class=\"ov seg\">MA<\/span> ≅ <span class=\"ov seg\">TH<\/span>. MA = x² − 3x and TH = 4x + 18. What is the length of <span class=\"ov seg\">TH<\/span>?", "fields": [{"label": "TH", "acc": ["54", "10"]}], "steps": ["Congruent means same length, so set them equal: x² − 3x = 4x + 18.", "Get everything on one side: x² − 7x − 18 = 0.", "Factor: (x − 9)(x + 2) = 0, so x = 9 or x = −2.", "Plug each into TH: 4(9) + 18 = 54 and 4(−2) + 18 = 10.", "Check MA too: 9² − 3(9) = 54 ✓ and (−2)² − 3(−2) = 10 ✓. Both give positive lengths, so both work.", "Remember: x can be negative. Only a LENGTH can't be negative or zero."], "answer": "TH = 54 (from x = 9). x = −2 also works and gives TH = 10.", "img": "n_math", "svg": null, "sec": null}]}, {"title": "Station 5: Segment Addition", "note": "A, B, C, D, G are collinear. E, F, G, H, J are collinear. CD = 10.4, BD = 19.1, GJ = 21.3, BG = 30.6, AB = BC = EF = GH, and DG = FG.", "img": "st5", "probs": [{"type": "num", "q": "1. Find AB, CG, AG, FG, EH, and EJ.", "fields": [{"label": "AB", "acc": ["8.7"]}, {"label": "CG", "acc": ["21.9"]}, {"label": "AG", "acc": ["39.3"]}, {"label": "FG", "acc": ["11.5"]}, {"label": "EH", "acc": ["28.9"]}, {"label": "EJ", "acc": ["41.5"]}], "steps": ["Start where you can: BD = BC + CD, so BC = 19.1 − 10.4 = 8.7. And AB = BC, so AB = 8.7.", "CG = BG − BC = 30.6 − 8.7 = 21.9.", "AG = AB + BG = 8.7 + 30.6 = 39.3.", "DG = BG − BD = 30.6 − 19.1 = 11.5, and FG = DG, so FG = 11.5.", "EF = GH = 8.7 (they equal AB). EH = EF + FG + GH = 8.7 + 11.5 + 8.7 = 28.9.", "EJ = EF + FG + GJ = 8.7 + 11.5 + 21.3 = 41.5.", "Key tip: circle the givens, and use | and || tick marks for the equal pieces."], "answer": "AB = 8.7, CG = 21.9, AG = 39.3, FG = 11.5, EH = 28.9, EJ = 41.5", "img": "st5", "svg": null, "sec": null}, {"type": "num", "q": "2. B is between A and C. AB = 7x + 2, BC = 2x − 1, AC = 64. Solve for x, then find AB and BC.", "fields": [{"label": "x", "acc": ["7"]}, {"label": "AB", "acc": ["51"]}, {"label": "BC", "acc": ["13"]}], "steps": ["7x + 2 + 2x − 1 = 64", "9x + 1 = 64 → 9x = 63 → x = 7", "AB = 7(7) + 2 = 51 and BC = 2(7) − 1 = 13", "Check: 51 + 13 = 64 ✓"], "answer": "x = 7, AB = 51, BC = 13", "img": null, "svg": "<svg viewBox=\"0 0 380 106\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:380px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"24\" y1=\"70\" x2=\"356\" y2=\"70\" stroke=\"#111\" stroke-width=\"2.5\"/><circle cx=\"24\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"24\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">A<\/text><circle cx=\"239.8\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"239.8\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">B<\/text><circle cx=\"356\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"356\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">C<\/text><text x=\"131.9\" y=\"94\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">7x + 2<\/text><text x=\"297.9\" y=\"94\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">2x − 1<\/text><line x1=\"24\" y1=\"36\" x2=\"356\" y2=\"36\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"24\" y1=\"29\" x2=\"24\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"356\" y1=\"29\" x2=\"356\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><rect x=\"174.0\" y=\"25\" width=\"32\" height=\"20\" fill=\"#fff\"/><text x=\"190.0\" y=\"41\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">64<\/text><\/svg>", "sec": null}, {"type": "num", "q": "3. B is between a segment is the point that splits it into <b>two congruent segments<\/b>.<\/p>\n<p>A <b>segment bisector<\/b> is anything (a point, ray, line, segment, or plane) that passes through the midpoint.<\/p>\n<div class=\"ex\">If M is the midpoint of <span class=\"ov seg\">AB<\/span>, then <span class=\"ov seg\">AM<\/span> ≅ <span class=\"ov seg\">MB<\/span>. That means AM = MB, and each half is ½ of AB. So AB = 2 · AM.<\/div>", "chk": {"q": "M is the midpoint of <span class=\"ov seg\">AB<\/span>, and AM = 7. What is AB?", "choices": ["7", "3.5", "14", "21"], "ans": 2, "why": "Each half is 7, so the whole is 2 × 7 = 14.", "type": "check"}}, {"h": "Midpoint on a number line", "body": "\n<p>The midpoint is the <b>average<\/b> of the two coordinates: add them and divide by 2.<\/p>\n<div class=\"big\">midpoint = (a + b) ÷ 2<\/div>\n<div class=\"ex\">Points at −6 and 10: (−6 + 10) ÷ 2 = 4 ÷ 2 = <b>2<\/b>.<\/div>", "chk": {"q": "What is the midpoint between −4 and 8 on a number line?", "choices": ["2", "6", "4", "−6"], "ans": 0, "why": "(−4 + 8) ÷ 2 = 4 ÷ 2 = 2.", "type": "check"}}, {"h": "The Midpoint Formula", "body": "\n<p>On a coordinate plane, do the same thing twice: <b>average the x's, then average the y's<\/b>.<\/p>\n<div class=\"big\">M = ( (x₁ + x₂)/2 , (y₁ + y₂)/2 )<\/div>\n<div class=\"ex\">A(2, 5) and B(8, −1):<br>x: (2 + 8)/2 = 5 &nbsp;&nbsp; y: (5 + (−1))/2 = 2<br>Midpoint = <b>(5, 2)<\/b><\/div>\n<div class=\"tip\">A midpoint can have decimals or fractions. (−3 + 6)/2 = 1.5 is fine.<\/div>", "chk": {"q": "What is the midpoint of (−2, 3) and (4, 7)?", "choices": ["(1, 5)", "(2, 10)", "(3, 2)", "(1, 2)"], "ans": 0, "why": "x: (−2 + 4)/2 = 1. y: (3 + 7)/2 = 5. Midpoint = (1, 5).", "type": "check"}}, {"h": "Finding a missing endpoint", "body": "\n<p>Sometimes you know one endpoint and the midpoint, and you need the other endpoint.<\/p>\n<p><b>Walk it:<\/b> figure out how far you moved from the endpoint to the midpoint, then take that same step again.<\/p>\n<div class=\"ex\">A(1, 3) and midpoint M(4, −1).<br>From A to M: x goes +3, y goes −4.<br>Do it again from M: (4 + 3, −1 − 4) = <b>B(7, −5)<\/b>.<\/div>\n<p><b>Shortcut:<\/b> other endpoint = 2 × midpoint − known endpoint. For x: 2(4) − 1 = 7. For y: 2(−1) − 3 = −5.<\/p>", "chk": {"q": "Midpoint M(3, 1) and endpoint A(−1, 4). What is the other endpoint?", "choices": ["(1, 2.5)", "(7, −2)", "(4, −3)", "(−5, 7)"], "ans": 1, "why": "A to M: x +4, y −3. Again from M: (3 + 4, 1 − 3) = (7, −2).", "type": "check"}}, {"h": "Midpoints with algebra", "body": "\n<p>Same routine as 1.2. The key fact: the two halves are <b>equal<\/b>.<\/p>\n<ol class=\"steps-list\"><li>Set the two halves equal (AM = MB).<\/li><li>Solve for x.<\/li><li>Plug in to get a half.<\/li><li>If they want the whole segment, double it.<\/li><\/ol>\n<div class=\"ex\">M is the midpoint of <span class=\"ov seg\">AB<\/span>. AM = 5x − 2 and MB = 3x + 6.<br>5x − 2 = 3x + 6 → 2x = 8 → x = 4.<br>AM = 18, so AB = <b>36<\/b>.<\/div>", "chk": {"q": "M is the midpoint of <span class=\"ov seg\">PQ<\/span>. PM = 2x + 1 and MQ = 3x − 4. What is x?", "choices": ["1", "3", "5", "11"], "ans": 2, "why": "2x + 1 = 3x − 4 → 5 = x.", "type": "check"}}, {"h": "The Distance Formula", "body": "\n<div class=\"big\">d = √[ (x₂ − x₁)² + (y₂ − y₁)² ]<\/div>\n<p>It's the Pythagorean Theorem in disguise. The horizontal change and vertical change are the legs of a right triangle, and the distance is the hypotenuse.<\/p>\n<ol class=\"steps-list\"><li>Subtract the x's. Subtract the y's.<\/li><li>Square each one (squares are never negative).<\/li><li>Add them.<\/li><li>Take the square root. Simplify it, or round if they ask.<\/li><\/ol>\n<div class=\"ex\">(1, 2) to (4, 6): changes are 3 and 4.<br>3² + 4² = 9 + 16 = 25, so d = √25 = <b>5<\/b>.<\/div>", "chk": {"q": "What is the distance from (−2, 3) to (4, −5)?", "choices": ["14", "10", "100", "√28"], "ans": 1, "why": "Changes: 6 and 8. 36 + 64 = 100, and √100 = 10.", "type": "check"}}, {"h": "Simplifying square roots", "body": "\n<p>Distance answers often come out as square roots. This is why the Do Now had you simplify √125.<\/p>\n<ol class=\"steps-list\"><li>Find the <b>biggest perfect square<\/b> that divides the number (4, 9, 16, 25, 36, 49, 64, 81, 100...).<\/li><li>Split: √(perfect square × leftover).<\/li><li>Take the square root of the perfect square and put it out front.<\/li><\/ol>\n<div class=\"ex\">√125 = √(25 · 5) = <b>5√5<\/b><br>√72 = √(36 · 2) = <b>6√2<\/b><br>√48 = √(16 · 3) = <b>4√3<\/b><\/div>\n<div class=\"tip\">If you use a smaller square by accident (√72 = √(4 · 18) = 2√18), keep going. 18 still has 9 inside it.<\/div>", "chk": {"q": "Simplify √50.", "choices": ["25√2", "5√2", "2√5", "10√5"], "ans": 1, "why": "50 = 25 · 2, and √25 = 5, so √50 = 5√2.", "type": "check"}}], "sets": [{"title": "1.3 Practice", "note": "Your uploads didn't include 1.3 worksheets, so these are new problems in the same style.", "probs": [{"type": "num", "q": "1. On a number line, A is at −6 and B is at 10. Find the midpoint of <span class=\"ov seg\">AB<\/span>.", "fields": [{"label": "midpoint", "acc": ["2"]}], "steps": ["Average the coordinates: (−6 + 10) ÷ 2.", "4 ÷ 2 = 2."], "answer": "2", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "2. Find the midpoint of (2, 5) and (8, −1). Type it as (x, y).", "fields": [{"label": "midpoint", "acc": ["(5,2)"]}], "steps": ["x: (2 + 8)/2 = 10/2 = 5", "y: (5 + (−1))/2 = 4/2 = 2"], "answer": "(5, 2)", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "3. Find the midpoint of (−3, 4) and (6, −2).", "fields": [{"label": "midpoint", "acc": ["(1.5,1)", "(3/2,1)"]}], "steps": ["x: (−3 + 6)/2 = 3/2 = 1.5", "y: (4 + (−2))/2 = 2/2 = 1"], "answer": "(1.5, 1)", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "4. A(1, 3) is an endpoint and M(4, −1) is the midpoint of <span class=\"ov seg\">AB<\/span>. Find B.", "fields": [{"label": "B", "acc": ["(7,-5)"]}], "steps": ["A to M: x goes 1 → 4 (up 3). y goes 3 → −1 (down 4).", "Same step again from M: x = 4 + 3 = 7, y = −1 − 4 = −5.", "Shortcut check: 2(4) − 1 = 7 and 2(−1) − 3 = −5 ✓"], "answer": "B(7, −5)", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "5. M(−2, 5) is the midpoint of <span class=\"ov seg\">JK<\/span>, and J(3, 9). Find K.", "fields": [{"label": "K", "acc": ["(-7,1)"]}], "steps": ["J to M: x goes 3 → −2 (down 5). y goes 9 → 5 (down 4).", "Same step from M: x = −2 − 5 = −7, y = 5 − 4 = 1."], "answer": "K(−7, 1)", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "6. M is the midpoint of <span class=\"ov seg\">AB<\/span>. AM = 5x − 2 and MB = 3x + 6. Find x, AM, and AB.", "fields": [{"label": "x", "acc": ["4"]}, {"label": "AM", "acc": ["18"]}, {"label": "AB", "acc": ["36"]}], "steps": ["Midpoint means the halves are equal: 5x − 2 = 3x + 6.", "2x = 8 → x = 4.", "AM = 5(4) − 2 = 18. (Check MB = 3(4) + 6 = 18 ✓)", "AB = 2 × 18 = 36."], "answer": "x = 4, AM = 18, AB = 36", "img": null, "svg": "<svg viewBox=\"0 0 380 76\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:380px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"24\" y1=\"40\" x2=\"356\" y2=\"40\" stroke=\"#111\" stroke-width=\"2.5\"/><circle cx=\"24\" cy=\"40\" r=\"4\" fill=\"#111\"/><text x=\"24\" y=\"64\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">A<\/text><circle cx=\"190.0\" cy=\"40\" r=\"4\" fill=\"#111\"/><text x=\"190.0\" y=\"64\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">M<\/text><circle cx=\"356\" cy=\"40\" r=\"4\" fill=\"#111\"/><text x=\"356\" y=\"64\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">B<\/text><text x=\"107.0\" y=\"64\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">5x − 2<\/text><text x=\"273.0\" y=\"64\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">3x + 6<\/text><\/svg>", "sec": null}, {"type": "num", "q": "7. Line ℓ bisects <span class=\"ov seg\">XY<\/span> at M. XM = 4x + 1 and XY = 42. Find x and XM.", "fields": [{"label": "x", "acc": ["5"]}, {"label": "XM", "acc": ["21"]}], "steps": ["A bisector cuts the segment in half, so XM is half of 42, which is 21.", "4x + 1 = 21 → 4x = 20 → x = 5.", "Or: the whole is double the half, 2(4x + 1) = 42 → 8x + 2 = 42 → x = 5."], "answer": "x = 5, XM = 21", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "8. Find the distance between (1, 2) and (4, 6).", "fields": [{"label": "distance", "acc": ["5"]}], "steps": ["Changes: x 4 − 1 = 3, y 6 − 2 = 4.", "3² + 4² = 9 + 16 = 25.", "√25 = 5."], "answer": "5", "img": null, "svg": null, "sec": null}, {"type": "num", "q": "9. Find the distance between (−2, 3) and (4, −5).", "fields": [{"label": "distance", "acc": ["10"]}], "steps": ["Changes: x 4 − (−2) = 6, y −5 − 3 = −8.", "6² + (−8)² = 36 + 64 = 100. (Negative squared is positive.)", "√100 = 10."], "answer": "10", "img": null, "svg": null, "sec": null}, {"type": "mc", "q": "10. Find the distance between (0, 0) and (10, 5). Give the simplified radical.", "choices": ["√15", "5√5", "25√5", "15"], "ans": 1, "steps": ["Changes: 10 and 5.", "10² + 5² = 100 + 25 = 125.", "√125 = √(25 · 5) = 5√5 (the Do Now!). About 11.2."], "answer": "5√5 ≈ 11.2", "img": null, "svg": null, "sec": null}, {"type": "mc", "q": "11. Find the distance between (−1, −4) and (2, 2).", "choices": ["3√5", "9", "5√3", "√15"], "ans": 0, "steps": ["Changes: 2 − (−1) = 3 and 2 − (−4) = 6.", "9 + 36 = 45.", "√45 = √(9 · 5) = 3√5 ≈ 6.7."], "answer": "3√5 ≈ 6.7", "img": null, "svg": null, "sec": null}, {"type": "mc", "q": "12. Simplify √48.", "choices": ["2√12", "4√3", "3√4", "16√3"], "ans": 1, "steps": ["Biggest perfect square in 48 is 16 (16 · 3 = 48).", "√48 = √16 · √3 = 4√3.", "2√12 is not finished: 12 still has a 4 inside."], "answer": "4√3", "img": null, "svg": null, "sec": null}, {"type": "mc", "q": "13. A(1, 1), B(4, 5), C(−2, 0), D(2, 3). Is <span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span>?", "choices": ["Yes, both are 5", "No, AB = 5 and CD = 7", "No, AB = 7 and CD = 5", "Yes, both are 7"], "ans": 0, "steps": ["AB: changes 3 and 4 → √(9 + 16) = 5.", "CD: changes 4 and 3 → √(16 + 9) = 5.", "Equal lengths, so the segments are congruent."], "answer": "Yes, AB = CD = 5", "img": null, "svg": null, "sec": null}]}]}, {"id": "1.4", "title": "Measuring and Classifying Angles", "color": "#fb923c", "blurb": "Naming angles, angle addition, bisectors, classifying", "topics": [{"h": "What is an angle?", "body": "\n<p>An <b>angle<\/b> is two rays that share the same endpoint. The shared endpoint is the <b>vertex<\/b>. The two rays are the <b>sides<\/b>.<\/p>\n<table class=\"tbl\"><tr><th>Ways to name it<\/th><th>Rule<\/th><\/tr>\n<tr><td>∠ABC or ∠CBA<\/td><td>Three letters, <b>vertex in the middle<\/b><\/td><\/tr>\n<tr><td>∠B<\/td><td>Only if B is the vertex of just one angle<\/td><\/tr>\n<tr><td>∠1<\/td><td>A number written inside the angle<\/td><\/tr><\/table>\n<div class=\"ex\">For ∠ABC: vertex = B. Sides = <span class=\"ov ray\">BA<\/span> and <span class=\"ov ray\">BC<\/span>.<\/div>\n<div class=\"tip\">You can swap in any other point on the same side. If L and M are both on <span class=\"ov ray\">KN<\/span>, then ∠JKN = ∠JKL = ∠JKM.<\/div>", "chk": {"q": "What is the vertex of ∠QSR?", "choices": ["Q", "S", "R", "There isn't one"], "ans": 1, "why": "The vertex is always the middle letter.", "type": "check"}}, {"h": "Measuring and classifying", "body": "\n<p><b>m∠ABC<\/b> means \"the measure of angle ABC\" in degrees. You find it with a protractor.<\/p>\n<table class=\"tbl\"><tr><th>Type<\/th><th>Measure<\/th><\/tr>\n<tr><td><b>Acute<\/b><\/td><td>more than 0° and less than 90°<\/td><\/tr>\n<tr><td><b>Right<\/b><\/td><td>exactly 90° (marked with a little box)<\/td><\/tr>\n<tr><td><b>Obtuse<\/b><\/td><td>more than 90° and less than 180°<\/td><\/tr>\n<tr><td><b>Straight<\/b><\/td><td>exactly 180° (a straight line)<\/td><\/tr><\/table>\n<div class=\"tip\">Protractor tip: put the center on the vertex and line up one side with 0. Then ask \"is this angle smaller or bigger than a corner of paper?\" to pick the right scale.<\/div>", "chk": {"q": "An angle measures 91°. What type is it?", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 2, "why": "Anything between 90° and 180° is obtuse.", "type": "check"}}, {"h": "Angle Addition Postulate", "body": "\n<p>Same idea as segment addition: <b>small + small = big<\/b>.<\/p>\n<div class=\"big\">If D is in the interior of ∠ABC: m∠ABD + m∠DBC = m∠ABC<\/div>\n<div class=\"ex\">m∠ABC = 94°, m∠ABD = (3x + 15)°, m∠DBC = (x + 7)°.<br>(3x + 15) + (x + 7) = 94 → 4x + 22 = 94 → x = 18.<br>m∠CBD = 18 + 7 = <b>25°<\/b>.<\/div>", "chk": {"q": "m∠ABD = 40° and m∠DBC = 35°. What is m∠ABC?", "choices": ["5°", "75°", "140°", "105°"], "ans": 1, "why": "Small + small = big: 40 + 35 = 75°.", "type": "check"}}, {"h": "Congruent angles and angle bisectors", "body": "\n<p><b>Congruent angles<\/b> have the same measure. Matching arcs in a diagram mean congruent angles.<\/p>\n<p>An <b>angle bisector<\/b> is a ray that splits an angle into <b>two congruent angles<\/b>.<\/p>\n<ol class=\"steps-list\"><li>Set the two halves equal.<\/li><li>Solve for x.<\/li><li>Plug in to get one half.<\/li><li>The whole angle is <b>2 × one half<\/b>.<\/li><\/ol>\n<div class=\"ex\"><span class=\"ov ray\">BD<\/span> bisects ∠ABC. m∠ABD = 4x, m∠DBC = (3x + 6).<br>4x = 3x + 6 → x = 6. Each half = 24°. m∠ABC = <b>48°<\/b>.<\/div>", "chk": {"q": "<span class=\"ov ray\">BD<\/span> bisects ∠ABC and m∠ABD = 35°. What is m∠ABC?", "choices": ["35°", "17.5°", "70°", "145°"], "ans": 2, "why": "A bisector makes two equal halves. 35 + 35 = 70°.", "type": "check"}}, {"h": "Using right angles and straight lines", "body": "\n<p>Many \"find the angle\" problems don't give an equation. You use what the picture tells you:<\/p>\n<div class=\"rule\">Pieces that make a <b>right angle<\/b> (box) add to <b>90°<\/b>.<\/div>\n<div class=\"rule\">Pieces that make a <b>straight line<\/b> add to <b>180°<\/b>.<\/div>\n<div class=\"ex\">A 75° angle and angle <i>c<\/i> fill a right-angle corner, so c = 90 − 75 = <b>15°<\/b>.<br>Angle <i>a<\/i> and a 160° angle sit along one straight line, so a = 180 − 160 = <b>20°<\/b>.<\/div>", "chk": {"q": "Two angles together form a straight line. One is 128°. What is the other?", "choices": ["38°", "52°", "62°", "232°"], "ans": 1, "why": "Straight line = 180°. 180 − 128 = 52°.", "type": "check"}}, {"h": "Angles on a coordinate plane", "body": "\n<ol class=\"steps-list\"><li>Plot A, B, C.<\/li><li>Draw rays from <b>B<\/b> (the vertex) through A and through C.<\/li><li>Classify by eye: smaller than a square corner, a square corner, or bigger?<\/li><li>A point in the <b>interior<\/b> is any point in the open space between the two rays.<\/li><\/ol>\n<div class=\"tip\">If one ray goes straight across and the other goes straight up or down, it's a right angle.<\/div>", "chk": {"q": "B(−2, −1), A(−2, −4), C(3, −1). Classify ∠ABC.", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 1, "why": "<span class=\"ov ray\">BA<\/span> points straight down and <span class=\"ov ray\">BC<\/span> points straight right. That's a square corner: right.", "type": "check"}}], "sets": [{"title": "1.4 Worksheet: Naming and classifying", "note": "This worksheet has no answer key in your uploads, so these answers are worked out here.", "probs": [{"type": "show", "q": "1. Measure the angle. Write two names for it, then name the vertex and the sides.", "answer": "About 60° (acute). Names: ∠ABC, ∠CBA, ∠B. Vertex: B. Sides: <span class=\"ov ray\">BA<\/span> and <span class=\"ov ray\">BC<\/span>.", "steps": ["Vertex is where the rays meet: B. Put B in the middle of the name.", "Sides are the two rays starting at B.", "Measured on the printed sheet it's about 60°. Your protractor reading may be a couple of degrees off, which is normal."], "img": "a1", "svg": null, "reveal_img": null, "sec": null}, {"type": "show", "q": "2. Measure the angle. Write two names for it, then name the vertex and the sides.", "answer": "About 38° (acute). Names: ∠MOP, ∠POM, ∠O. Vertex: O. Sides: <span class=\"ov ray\">OM<\/span> and <span class=\"ov ray\">OP<\/span>.", "steps": ["Vertex: O. Sides: the rays from O through M and through P.", "It's smaller than a square corner, so it's acute. About 38°."], "img": "a2", "svg": null, "reveal_img": null, "sec": null}, {"type": "show", "q": "3. Measure the angle. Write two names for it, then name the vertex and the sides.", "answer": "About 111° (obtuse). Names: ∠EFG, ∠GFE, ∠F. Vertex: F. Sides: <span class=\"ov ray\">FE<\/span> and <span class=\"ov ray\">FG<\/span>.", "steps": ["Vertex: F. Sides: <span class=\"ov ray\">FE<\/span> and <span class=\"ov ray\">FG<\/span>.", "It opens wider than a square corner, so it's obtuse. Read the bigger number on the protractor: about 111°."], "img": "a3", "svg": null, "reveal_img": null, "sec": null}, {"type": "mc", "q": "4. ∠JKN: another name, and its type?", "choices": ["∠KJN, right", "∠JKM, right", "∠JKM, acute", "∠NKJ, straight"], "ans": 1, "steps": ["Vertex is K. L, M, N are all on the same ray from K, so ∠JKN = ∠JKL = ∠JKM.", "Side KJ goes straight up and side KN goes straight across: a right angle."], "answer": "∠JKL or ∠JKM (or ∠NKJ); right", "img": "a49", "svg": null, "sec": null}, {"type": "mc", "q": "5. ∠KMN: another name, and its type?", "choices": ["∠LMN, straight", "∠KNM, straight", "∠LMN, obtuse", "∠MKN, acute"], "ans": 0, "steps": ["Vertex is M. K and N are on opposite sides of M on the same line.", "Opposite rays form a straight angle: 180°.", "L is on the same side as K, so ∠LMN works too."], "answer": "∠LMN or ∠NMK; straight", "img": "a49", "svg": null, "sec": null}, {"type": "mc", "q": "6. ∠PQM: which is another name?", "choices": ["∠QPM", "∠MQP", "∠PMQ", "∠QMP"], "ans": 1, "steps": ["The vertex Q must stay in the middle, so just reverse the outside letters: ∠MQP.", "On type: this one looks very close to 90°, so it appears to be a right angle. Diagrams like this are hard to judge, so check with your teacher."], "answer": "∠MQP", "img": "a49", "svg": null, "sec": null}, {"type": "mc", "q": "7. ∠JML: another name, and its type?", "choices": ["∠JMK, acute", "∠JLM, acute", "∠JMK, obtuse", "∠LMJ, right"], "ans": 0, "steps": ["Vertex is M. K is on the same ray from M as L, so ∠JML = ∠JMK. Q is on <span class=\"ov ray\">MJ<\/span>, so ∠QML also works.", "It's a narrow angle: acute."], "answer": "∠JMK, ∠QML, or ∠LMJ; acute", "img": "a49", "svg": null, "sec": null}, {"type": "mc", "q": "8. ∠QPN: another name, and its type?", "choices": ["∠LPN, acute", "∠QNP, acute", "∠LPN, obtuse", "∠PQN, right"], "ans": 0, "steps": ["Vertex is P. L is on the same ray from P as Q, so ∠QPN = ∠LPN.", "Narrow angle: acute."], "answer": "∠LPN or ∠NPQ; acute", "img": "a49", "svg": null, "sec": null}, {"type": "mc", "q": "9. ∠PLK: another name, and its type?", "choices": ["∠QLK, acute", "∠QLK, obtuse", "∠PKL, obtuse", "∠KLM, straight"], "ans": 1, "steps": ["Vertex is L. Q is on <span class=\"ov ray\">LP<\/span>, so ∠PLK = ∠QLK.", "It opens wider than a square corner (from the slanted side all the way back to K): obtuse."], "answer": "∠QLK or ∠KLP; obtuse", "img": "a49", "svg": null, "sec": null}]}, {"title": "1.4 Worksheet: Finding angle measures", "probs": [{"type": "num", "q": "10. Given m∠ABC = 94°, find m∠CBD.", "fields": [{"label": "x", "acc": ["18"]}, {"label": "m∠CBD", "acc": ["25"]}], "steps": ["Small + small = big: (3x + 15) + (x + 7) = 94.", "4x + 22 = 94 → 4x = 72 → x = 18.", "m∠CBD = 18 + 7 = 25°.", "Check: m∠ABD = 3(18) + 15 = 69, and 69 + 25 = 94 ✓"], "answer": "x = 18, m∠CBD = 25°", "img": "a10", "svg": null, "sec": null}, {"type": "num", "q": "11. Given m∠QST = 135°, find m∠QSR.", "fields": [{"label": "x", "acc": ["28"]}, {"label": "m∠QSR", "acc": ["85"]}], "steps": ["(3x + 1) + (2x − 6) = 135.", "5x − 5 = 135 → 5x = 140 → x = 28.", "m∠QSR = 3(28) + 1 = 85°.", "Check: m∠RST = 50, and 85 + 50 = 135 ✓"], "answer": "x = 28, m∠QSR = 85°", "img": "a11", "svg": null, "sec": null}, {"type": "num", "q": "12–15. Find a, b, c, and d.", "fields": [{"label": "a", "acc": ["20"]}, {"label": "b", "acc": ["160"]}, {"label": "c", "acc": ["15"]}, {"label": "d", "acc": ["75"]}], "steps": ["<b>c:<\/b> The box shows the corner between the down ray and the right ray is 90°. That corner is split into 75° and c. c = 90 − 75 = 15.", "<b>d:<\/b> The slanted line through the left crossing is straight, so the angles along its top side add to 180: d + 90 + c = 180. d = 180 − 90 − 15 = 75.", "<b>a:<\/b> The slanted line on the right is straight. a and 160° fill its one side: a = 180 − 160 = 20.", "<b>b:<\/b> The horizontal line is straight. a and b fill its top side: b = 180 − 20 = 160."], "answer": "a = 20°, b = 160°, c = 15°, d = 75°", "img": "a1215", "svg": null, "sec": null}, {"type": "num", "q": "16. <span class=\"ov ray\">BD<\/span> bisects ∠ABC. Find m∠ABC.", "fields": [{"label": "x", "acc": ["6"]}, {"label": "m∠ABC", "acc": ["48"]}], "steps": ["Bisector → the two halves are equal: 4x = 3x + 6.", "x = 6. Each half = 4(6) = 24°.", "m∠ABC = 2 × 24 = 48°."], "answer": "x = 6, m∠ABC = 48°", "img": "a16", "svg": null, "sec": null}, {"type": "num", "q": "17. <span class=\"ov ray\">BD<\/span> bisects ∠ABC. Find m∠ABC.", "fields": [{"label": "x", "acc": ["12"]}, {"label": "m∠ABC", "acc": ["98"]}], "steps": ["5x − 11 = 4x + 1 → x = 12.", "Each half = 4(12) + 1 = 49°.", "m∠ABC = 2 × 49 = 98°."], "answer": "x = 12, m∠ABC = 98°", "img": "a17", "svg": null, "sec": null}, {"type": "num", "q": "18. <span class=\"ov ray\">BD<\/span> bisects ∠ABC. Find m∠ABC.", "fields": [{"label": "x", "acc": ["9"]}, {"label": "m∠ABC", "acc": ["112"]}], "steps": ["8x − 16 = 4x + 20 → 4x = 36 → x = 9.", "Each half = 4(9) + 20 = 56°.", "m∠ABC = 2 × 56 = 112°."], "answer": "x = 9, m∠ABC = 112°", "img": "a18", "svg": null, "sec": null}]}, {"title": "1.4 Worksheet: Coordinate angles and word problems", "probs": [{"type": "mc", "q": "19. A(2, 3), B(3, 0), C(2, 6). Plot the points and draw ∠ABC. Classify it.", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 0, "steps": ["Both rays leave B going up and slightly left, very close together.", "That's a narrow angle: acute.", "Interior point: any point between the rays, like (2, 4) (the orange dot)."], "answer": "Acute. Interior point example: (2, 4)", "img": null, "svg": null, "sec": null, "reveal_svg": "<svg viewBox=\"0 0 280 280\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:280px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"10.0\" y1=\"270.0\" x2=\"10.0\" y2=\"10.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"10.0\" y1=\"270.0\" x2=\"270.0\" y2=\"270.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"42.5\" y1=\"270.0\" x2=\"42.5\" y2=\"10.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"10.0\" y1=\"237.5\" x2=\"270.0\" y2=\"237.5\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"75.0\" y1=\"270.0\" x2=\"75.0\" y2=\"10.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"10.0\" y1=\"205.0\" x2=\"270.0\" y2=\"205.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"107.5\" y1=\"270.0\" x2=\"107.5\" y2=\"10.0\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"10.0\" y1=\"172.5\" x2=\"270.0\" y2=\"172.5\" stroke=\"#bbb\" stroke-width=\"0.7\"/><line x1=\"140.0\" y1=\"270.0\" x2=\"140.0\"
