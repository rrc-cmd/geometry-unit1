, "svg": null, "sec": "1.2"}, {"type": "num", "q": "P, Q, R, S are collinear in that order. PS = 50, RS = 20, and PQ = QR. Find PQ.", "fields": [{"label": "PQ", "acc": ["15"]}], "steps": ["PR = PS − RS = 50 − 20 = 30.", "PQ = QR, so each is 30 ÷ 2 = 15."], "answer": "15", "img": null, "svg": "<svg viewBox=\"0 0 380 106\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:380px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"24\" y1=\"70\" x2=\"356\" y2=\"70\" stroke=\"#111\" stroke-width=\"2.5\"/><circle cx=\"24\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"24\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">P<\/text><circle cx=\"123.6\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"123.6\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">Q<\/text><circle cx=\"223.2\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"223.2\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">R<\/text><circle cx=\"356\" cy=\"70\" r=\"4\" fill=\"#111\"/><text x=\"356\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">S<\/text><text x=\"289.6\" y=\"94\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">20<\/text><line x1=\"24\" y1=\"36\" x2=\"356\" y2=\"36\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"24\" y1=\"29\" x2=\"24\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><line x1=\"356\" y1=\"29\" x2=\"356\" y2=\"43\" stroke=\"#111\" stroke-width=\"1.2\"/><rect x=\"174.0\" y=\"25\" width=\"32\" height=\"20\" fill=\"#fff\"/><text x=\"190.0\" y=\"41\" font-size=\"14\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Arial,sans-serif\">50<\/text><\/svg>", "sec": "1.2"}, {"type": "num", "q": "On a number line, find the midpoint of −7 and 13.", "fields": [{"label": "midpoint", "acc": ["3"]}], "steps": ["(−7 + 13) ÷ 2 = 6 ÷ 2 = 3."], "answer": "3", "img": null, "svg": null, "sec": "1.3"}, {"type": "num", "q": "Find the distance between (−3, −2) and (3, 6).", "fields": [{"label": "distance", "acc": ["10"]}], "steps": ["Changes: 6 and 8.", "36 + 64 = 100, √100 = 10."], "answer": "10", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "What is the midpoint of (0, 8) and (−6, −4)?", "choices": ["(−3, 2)", "(−6, 4)", "(3, 6)", "(−3, 6)"], "ans": 0, "steps": ["x: (0 + (−6))/2 = −3", "y: (8 + (−4))/2 = 2"], "answer": "(−3, 2)", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "The midpoint of <span class=\"ov seg\">AB<\/span> is (−1, −1) and A(2, 3). Find B.", "choices": ["(0.5, 1)", "(−4, −5)", "(1, 2)", "(−3, −4)"], "ans": 1, "steps": ["A to M: x −3, y −4.", "Same step from M: (−1 − 3, −1 − 4) = (−4, −5)."], "answer": "(−4, −5)", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "Find the distance between (1, 1) and (4, 4).", "choices": ["3", "6", "3√2", "9√2"], "ans": 2, "steps": ["Changes: 3 and 3.", "9 + 9 = 18.", "√18 = √(9 · 2) = 3√2 ≈ 4.2."], "answer": "3√2", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "An angle measures 135°. What type is it?", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 2, "steps": ["Between 90° and 180° is obtuse."], "answer": "Obtuse", "img": null, "svg": null, "sec": "1.4"}, {"type": "num", "q": "D is in the interior of ∠ABC. m∠ABC = 110°, m∠ABD = (2x + 10)°, m∠DBC = (4x − 2)°. Find m∠DBC.", "fields": [{"label": "m∠DBC", "acc": ["66"]}], "steps": ["(2x + 10) + (4x − 2) = 110 → 6x + 8 = 110 → x = 17.", "m∠DBC = 4(17) − 2 = 66°.", "Check: m∠ABD = 44, and 44 + 66 = 110 ✓"], "answer": "66°", "img": null, "svg": null, "sec": "1.4"}, {"type": "mc", "q": "What is the vertex of ∠PQR?", "choices": ["P", "Q", "R", "It depends on the diagram"], "ans": 1, "steps": ["The vertex is always the middle letter."], "answer": "Q", "img": null, "svg": null, "sec": "1.4"}, {"type": "num", "q": "Use the streets diagram, but suppose m∠AEB = 50° instead of 60°. ∠AED is still a right angle and m∠BEC = m∠CED. Find m∠CED.", "fields": [{"label": "m∠CED", "acc": ["20"]}], "steps": ["m∠BED = 90 − 50 = 40°.", "Split equally: 40 ÷ 2 = 20°."], "answer": "20°", "img": "a24", "svg": null, "sec": "1.4"}, {"type": "mc", "q": "A(−3, 0), B(0, 0), C(0, 4). Classify ∠ABC.", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 1, "steps": ["<span class=\"ov ray\">BA<\/span> goes straight left along the x-axis.", "<span class=\"ov ray\">BC<\/span> goes straight up the y-axis.", "The axes meet at a right angle."], "answer": "Right", "img": null, "svg": null, "sec": "1.4"}]}, {"name": "Practice Test 3", "qs": [{"type": "mc", "q": "Which line is the intersection of planes S and R?", "choices": ["Line <i>a<\/i>", "Line <i>b<\/i>", "Line <i>c<\/i>", "<span class=\"ov line\">QP<\/span>"], "ans": 1, "steps": ["Planes meet in a line.", "Line <i>b<\/i> (through M, J, N) runs along where the gray plane cuts the flat plane."], "answer": "Line b", "img": "n_dn", "svg": null, "sec": "1.1"}, {"type": "mc", "q": "Where does <span class=\"ov line\">LK<\/span> intersect plane S?", "choices": ["Point J", "Line <i>b<\/i>", "Point K", "Point M"], "ans": 0, "steps": ["A line and a plane meet at a point.", "Line <i>c<\/i> (<span class=\"ov line\">LK<\/span>) passes through the gray plane at J."], "answer": "Point J", "img": "n_dn", "svg": null, "sec": "1.1"}, {"type": "mc", "q": "Which point is collinear with P and S?", "choices": ["T", "W", "R", "U"], "ans": 2, "steps": ["P and S are on line <i>f<\/i>.", "R is also on line <i>f<\/i>."], "answer": "R (or Q)", "img": "st1", "svg": null, "sec": "1.1"}, {"type": "mc", "q": "When drawing figures, when should you use a dashed line?", "choices": ["For every line", "For rays only", "For parts hidden behind or under a plane", "For the intersection of two planes"], "ans": 2, "steps": ["Dashed lines show parts you couldn't see if the planes were solid.", "\"Careful with dashed lines!\""], "answer": "For hidden parts", "img": null, "svg": null, "sec": "1.1"}, {"type": "mc", "q": "Which is the same ray as <span class=\"ov ray\">AC<\/span>?", "choices": ["<span class=\"ov ray\">CA<\/span>", "<span class=\"ov ray\">AB<\/span>", "<span class=\"ov ray\">BA<\/span>", "<span class=\"ov ray\">CB<\/span>"], "ans": 1, "steps": ["<span class=\"ov ray\">AC<\/span> starts at A and goes right through C.", "B is farther along in that same direction, so <span class=\"ov ray\">AB<\/span> is the same ray."], "answer": "<span class=\"ov ray\">AB<\/span>", "img": null, "svg": "<svg viewBox=\"0 0 380 250\" xmlns=\"http://www.w3.org/2000/svg\" class=\"dia\" style=\"max-width:380px\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"11\" markerHeight=\"11\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"20\" y1=\"60\" x2=\"365\" y2=\"60\" stroke=\"#111\" stroke-width=\"2\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><line x1=\"20\" y1=\"190\" x2=\"365\" y2=\"190\" stroke=\"#111\" stroke-width=\"2\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><line x1=\"95\" y1=\"15\" x2=\"235\" y2=\"240\" stroke=\"#111\" stroke-width=\"2\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><line x1=\"330\" y1=\"15\" x2=\"170\" y2=\"240\" stroke=\"#111\" stroke-width=\"2\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\"/><circle cx=\"123\" cy=\"60\" r=\"4\" fill=\"#111\"/><text x=\"112\" y=\"50\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">E<\/text><circle cx=\"298\" cy=\"60\" r=\"4\" fill=\"#111\"/><text x=\"312\" y=\"50\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">D<\/text><circle cx=\"204\" cy=\"190\" r=\"4\" fill=\"#111\"/><text x=\"232\" y=\"182\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">C<\/text><circle cx=\"80\" cy=\"190\" r=\"4\" fill=\"#111\"/><text x=\"80\" y=\"180\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">A<\/text><circle cx=\"320\" cy=\"190\" r=\"4\" fill=\"#111\"/><text x=\"320\" y=\"180\" font-size=\"15\" text-anchor=\"middle\" fill=\"#111\" style=\"font-family:Georgia,serif;font-style:italic\">B<\/text><\/svg>", "sec": "1.1"}, {"type": "num", "q": "On a number line, find the distance between −7.5 and 4.", "fields": [{"label": "distance", "acc": ["11.5"]}], "steps": ["4 − (−7.5) = 4 + 7.5 = 11.5."], "answer": "11.5", "img": null, "svg": null, "sec": "1.2"}, {"type": "num", "q": "J is between H and K. HJ = 4x − 1, JK = 2x + 3, HK = 5x + 7. Find HK.", "fields": [{"label": "HK", "acc": ["32"]}], "steps": ["(4x − 1) + (2x + 3) = 5x + 7 → 6x + 2 = 5x + 7 → x = 5.", "HK = 5(5) + 7 = 32.", "Check: HJ = 19, JK = 13, 19 + 13 = 32 ✓"], "answer": "HK = 32", "img": null, "svg": null, "sec": "1.2"}, {"type": "num", "q": "<span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span>. AB = 5x − 8 and CD = 3x + 6. Find AB.", "fields": [{"label": "AB", "acc": ["27"]}], "steps": ["Congruent → equal lengths: 5x − 8 = 3x + 6.", "2x = 14 → x = 7.", "AB = 5(7) − 8 = 27."], "answer": "27", "img": null, "svg": null, "sec": "1.2"}, {"type": "mc", "q": "C(1, −4), D(1, 5), E(−2, 2), F(6, 2). Are <span class=\"ov seg\">CD<\/span> and <span class=\"ov seg\">EF<\/span> congruent?", "choices": ["Yes, both are 9", "No, CD = 9 and EF = 8", "No, CD = 1 and EF = 4", "Yes, both are 8"], "ans": 1, "steps": ["CD is vertical: 5 − (−4) = 9.", "EF is horizontal: 6 − (−2) = 8.", "9 ≠ 8, so not congruent."], "answer": "No", "img": null, "svg": null, "sec": "1.2"}, {"type": "num", "q": "A, B, C, D are collinear in that order. AD = 45, AB = 12, CD = 15. Find BC.", "fields": [{"label": "BC", "acc": ["18"]}], "steps": ["Whole = sum of the parts: 12 + BC + 15 = 45.", "BC = 45 − 27 = 18."], "answer": "18", "img": null, "svg": null, "sec": "1.2"}, {"type": "mc", "q": "What is the midpoint of (5, −3) and (−1, 7)?", "choices": ["(2, 2)", "(3, 5)", "(4, 4)", "(2, 5)"], "ans": 0, "steps": ["x: (5 + (−1))/2 = 2", "y: (−3 + 7)/2 = 2"], "answer": "(2, 2)", "img": null, "svg": null, "sec": "1.3"}, {"type": "num", "q": "Find the distance between (−1, 2) and (4, 14).", "fields": [{"label": "distance", "acc": ["13"]}], "steps": ["Changes: 5 and 12.", "25 + 144 = 169, √169 = 13."], "answer": "13", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "A(−3, 5) is an endpoint and M(0, 1) is the midpoint. Find the other endpoint.", "choices": ["(−1.5, 3)", "(3, −3)", "(3, 6)", "(−6, 9)"], "ans": 1, "steps": ["A to M: x +3, y −4.", "Same step from M: (0 + 3, 1 − 4) = (3, −3)."], "answer": "(3, −3)", "img": null, "svg": null, "sec": "1.3"}, {"type": "mc", "q": "Simplify √80.", "choices": ["4√5", "2√20", "8√10", "16√5"], "ans": 0, "steps": ["Biggest perfect square in 80 is 16.", "√80 = √16 · √5 = 4√5."], "answer": "4√5", "img": null, "svg": null, "sec": "1.3"}, {"type": "num", "q": "Line ℓ bisects <span class=\"ov seg\">PQ<\/span> at M. PM = 3x + 4 and MQ = 5x − 10. Find PQ.", "fields": [{"label": "PQ", "acc": ["50"]}], "steps": ["Halves equal: 3x + 4 = 5x − 10 → 14 = 2x → x = 7.", "PM = 3(7) + 4 = 25.", "PQ = 2 × 25 = 50."], "answer": "50", "img": null, "svg": null, "sec": "1.3"}, {"type": "num", "q": "In the flag, suppose m∠QNR = 35°. Find m∠QNP.", "fields": [{"label": "m∠QNP", "acc": ["125"]}], "steps": ["∠RNP is half of the straight angle MNP: 90°.", "m∠QNP = m∠QNR + m∠RNP = 35 + 90 = 125°."], "answer": "125°", "img": "a25", "svg": null, "sec": "1.4"}, {"type": "num", "q": "<span class=\"ov ray\">BD<\/span> bisects ∠ABC and m∠ABC = 86°. Find m∠ABD.", "fields": [{"label": "m∠ABD", "acc": ["43"]}], "steps": ["A bisector splits the angle in half: 86 ÷ 2 = 43°."], "answer": "43°", "img": null, "svg": null, "sec": "1.4"}, {"type": "num", "q": "∠ABC is a straight angle and m∠ABC = (4x + 2)°. Find x.", "fields": [{"label": "x", "acc": ["44.5"]}], "steps": ["Straight = 180°: 4x + 2 = 180.", "4x = 178 → x = 44.5."], "answer": "x = 44.5", "img": null, "svg": null, "sec": "1.4"}, {"type": "num", "q": "Use the 12–15 diagram, but suppose the 160° angle were 145°. What would <i>a<\/i> be?", "fields": [{"label": "a", "acc": ["35"]}], "steps": ["a and that angle sit along one straight line: a = 180 − 145 = 35°."], "answer": "35°", "img": "a1215", "svg": null, "sec": "1.4"}, {"type": "mc", "q": "A(4, 1), B(0, 0), C(−3, 2). Classify ∠ABC.", "choices": ["Acute", "Right", "Obtuse", "Straight"], "ans": 2, "steps": ["<span class=\"ov ray\">BA<\/span> goes right and a little up. <span class=\"ov ray\">BC<\/span> goes left and up.", "The opening is wider than a square corner: obtuse."], "answer": "Obtuse", "img": null, "svg": null, "sec": "1.4"}]}], "flash": [{"sec": "1.1", "term": "Point", "def_": "A location with no size. Named with one capital letter."}, {"sec": "1.1", "term": "Line", "def_": "Straight, goes forever both ways. Named by any 2 of its points <span class=\"ov line\">AB<\/span> or a lowercase letter."}, {"sec": "1.1", "term": "Plane", "def_": "A flat surface that goes forever. Named by 3 noncollinear points or one capital letter."}, {"sec": "1.1", "term": "Collinear", "def_": "Points on the same line. Any 2 points are always collinear."}, {"sec": "1.1", "term": "Coplanar", "def_": "Points in the same plane. Any 3 points are always coplanar."}, {"sec": "1.1", "term": "Segment", "def_": "Part of a line with two endpoints: <span class=\"ov seg\">AB<\/span>."}, {"sec": "1.1", "term": "Ray", "def_": "Has one endpoint and goes forever one way. <span class=\"ov ray\">AB<\/span> starts at A."}, {"sec": "1.1", "term": "Opposite rays", "def_": "Same endpoint, opposite directions. Together they form a line."}, {"sec": "1.1", "term": "Intersection", "def_": "Where figures meet. Lines: a point. Line & plane: a point. Two planes: a line."}, {"sec": "1.2", "term": "AB vs. <span class=\"ov seg\">AB<\/span>", "def_": "AB (no bar) is a length, a number. <span class=\"ov seg\">AB<\/span> is the segment itself."}, {"sec": "1.2", "term": "Ruler Postulate", "def_": "Distance on a number line = absolute value of the difference of the coordinates."}, {"sec": "1.2", "term": "Segment Addition Postulate", "def_": "If B is between A and C, then AB + BC = AC. Part + part = whole."}, {"sec": "1.2", "term": "Congruent segments", "def_": "Segments with the same length. <span class=\"ov seg\">AB<\/span> ≅ <span class=\"ov seg\">CD<\/span> means AB = CD."}, {"sec": "1.2", "term": "Tick marks", "def_": "Matching tick marks (| or ||) show segments that are congruent."}, {"sec": "1.3", "term": "Midpoint", "def_": "The point that splits a segment into two congruent halves."}, {"sec": "1.3", "term": "Segment bisector", "def_": "A point, ray, line, segment, or plane through a segment's midpoint."}, {"sec": "1.3", "term": "Midpoint Formula", "def_": "((x₁ + x₂)/2, (y₁ + y₂)/2). Average the x's, average the y's."}, {"sec": "1.3", "term": "Distance Formula", "def_": "√[(x₂ − x₁)² + (y₂ − y₁)²]. The Pythagorean Theorem on a graph."}, {"sec": "1.3", "term": "Simplify a radical", "def_": "Pull out the biggest perfect square: √125 = √(25 · 5) = 5√5."}, {"sec": "1.4", "term": "Angle", "def_": "Two rays with the same endpoint."}, {"sec": "1.4", "term": "Vertex", "def_": "The shared endpoint of an angle. Always the middle letter: B in ∠ABC."}, {"sec": "1.4", "term": "Acute angle", "def_": "Between 0° and 90°."}, {"sec": "1.4", "term": "Right angle", "def_": "Exactly 90°. Marked with a box."}, {"sec": "1.4", "term": "Obtuse angle", "def_": "Between 90° and 180°." <script>
const D = JSON.parse(document.getElementById('gd').textContent);
const IMG = D.img;
const COL = {'1.1':'#4fc3f7','1.2':'#a78bfa','1.3':'#34d399','1.4':'#fb923c'};
const P = {};      // id -> {p, mode, sec}
const R = {};      // id -> result state
let S = {view:'home', sec:0, tab:'learn', test:0, fsec:'all', done:{}};

// register every question with a stable id
D.sections.forEach((s, si) => {
  s.topics.forEach((t, ti) => { P[`c${si}_${ti}`] = {p:t.chk, mode:'check', sec:s.id}; });
  s.sets.forEach((st, a) => st.probs.forEach((p, b) => { P[`p${si}_${a}_${b}`] = {p, mode:'practice', sec:s.id}; }));
});
D.tests.forEach((t, ti) => t.qs.forEach((p, qi) => { P[`t${ti}_${qi}`] = {p, mode:'test', sec:p.sec}; }));

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fig = src => `<div class="fig"><img src="${src}" alt="Diagram"></div>`;
const figs = p => (p.img ? fig(IMG[p.img]) : '') + (p.svg ? `<div class="fig">${p.svg}</div>` : '');

// ---------- answer checking ----------
function norm(s){
  return String(s).toLowerCase().replace(/[\u2212\u2013\u2014]/g,'-').replace(/°|degrees?|miles?|\bmi\b|units?/g,'')
    .replace(/\s+/g,'').replace(/^[a-z\u2220]+=/, '');
}
function toNum(s){
  if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) { const [a,b] = s.split('/'); return parseFloat(a)/parseFloat(b); }
  if (/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}
function same(a, b){
  if (a === b) return true;
  const x = toNum(a), y = toNum(b);
  if (isFinite(x) && isFinite(y)) return Math.abs(x - y) < 1e-6;
  const ca = a.replace(/[()]/g,'').split(','), cb = b.replace(/[()]/g,'').split(',');
  if (ca.length === 2 && cb.length === 2) return ca.every((v,i) => { const m = toNum(v), n = toNum(cb[i]); return isFinite(m) && isFinite(n) && Math.abs(m-n) < 1e-6; });
  return false;
}
const matches = (val, acc) => val.trim() !== '' && acc.some(a => same(norm(val), norm(a)));

// ---------- card rendering ----------
function solHTML(p){
  let h = `<div class="sol"><div class="sol-h">How to solve it</div><ol>${p.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
  h += `<div class="sol-ans"><b>Answer:</b> ${p.answer}</div>`;
  if (p.reveal_img) h += `<div class="small">Your teacher's drawing:</div>` + fig(IMG[p.reveal_img]);
  if (p.reveal_svg) h += `<div class="fig">${p.reveal_svg}</div>`;
  return h + '</div>';
}
function cardHTML(id, num){
  const {p, mode, sec} = P[id];
  const r = R[id] || {};
  const L = 'ABCDEFG';
  let cls = r.locked ? (r.correct ? ' ok' : ' no') : '';
  let h = `<div class="card${cls}" id="${id}" style="--c:${COL[sec]}">`;
  if (mode === 'check') h += `<div class="chk-label">✏️ Check-in</div>`;
  if (mode === 'test') h += `<div class="qnum">Question ${num}<span class="chip">${sec}</span></div>`;
  h += `<div class="qtext">${p.q}</div>` + figs(p);

  if (mode === 'check' || p.type === 'mc'){
    const tf = p.choices.length === 2 && p.choices[0] === 'True';
    h += `<div class="choices${tf ? ' tf' : ''}">`;
    p.choices.forEach((c, i) => {
      let c2 = '';
      if (r.locked){ if (i === p.ans) c2 = ' right'; else if (i === r.chosen) c2 = ' wrong'; }
      h += `<button class="ch${c2}" data-act="mc" data-id="${id}" data-i="${i}" ${r.locked ? 'disabled' : ''}>${tf ? '' : `<span class="L">${L[i]}</span>`}<span>${c}</span></button>`;
    });
    h += '</div>';
    if (r.locked){
      h += `<div class="msg ${r.correct ? 'ok' : 'no'}">${r.correct ? '✅ Correct!' : '❌ Not quite.'}</div>`;
      h += mode === 'check' ? `<div class="why">${p.why}</div>` : solHTML(p);
    } else if (mode === 'practice' && r.peek) h += solHTML(p);
    else if (mode === 'practice') h += `<div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-act="peek" data-id="${id}">Show how to solve</button></div>`;
  }
  else if (p.type === 'num'){
    h += `<div class="fields">`;
    p.fields.forEach((f, fi) => {
      const v = (r.vals || [])[fi] || '';
      const st = r.marks ? (r.marks[fi] ? ' right' : ' wrong') : '';
      h += `<div class="fld"><label for="${id}_${fi}">${f.label}</label><input id="${id}_${fi}" class="${st.trim()}" data-id="${id}" value="${esc(v)}" ${r.locked ? 'disabled' : ''} autocomplete="off" inputmode="text">`;
      if (r.locked && r.marks && !r.marks[fi]) h += `<div class="corr">Answer: ${f.acc[0]}</div>`;
      h += `</div>`;
    });
    h += `</div>`;
    if (!r.locked) h += `<div class="btnrow"><button class="btn" data-act="check" data-id="${id}">Check</button>${mode === 'practice' && !r.peek ? `<button class="btn ghost" data-act="peek" data-id="${id}">Show how to solve</button>` : ''}</div>`;
    if (r.marks){
      const all = r.marks.every(Boolean);
      h += `<div class="msg ${all ? 'ok' : 'no'}">${all ? '✅ All correct!' : (r.locked ? '❌ Not quite. The right answers are shown in green.' : '❌ Not quite. Fix the red boxes and check again, or tap Show how to solve.')}</div>`;
    }
    if (r.locked || r.peek) h += solHTML(p);
  }
  else { // show
    if (r.peek) h += solHTML(p);
    else h += `<div class="btnrow"><button class="btn" data-act="peek" data-id="${id}">Show answer and steps</button></div><div class="small">Try it on paper first!</div>`;
  }
  return h + '</div>';
}
function refresh(id, num){
  const el = document.getElementById(id);
  if (el) el.outerHTML = cardHTML(id, num);
  if (P[id].mode === 'test') updateScore();
}

// ---------- progress helpers ----------
function secStats(si){
  const ids = Object.keys(P).filter(k => k.startsWith(`p${si}_`));
  const solved = ids.filter(k => R[k] && R[k].correct).length;
  return {solved, total: ids.length};
}

// ---------- views ----------
function nav(){
  const items = [['home','Home'], ...D.sections.map((s,i) => ['sec'+i, s.id]), ['flash','Flashcards'], ['tests','Practice Tests']];
  const cur = S.view === 'sec' ? 'sec'+S.sec : (S.view === 'test' ? 'tests' : S.view);
  document.getElementById('nav').innerHTML = `<span class="logo">📐 Geometry 1.1–1.4</span>` +
    items.map(([k,l]) => { const c = k.startsWith('sec') ? COL[D.sections[+k.slice(3)].id] : '#e9ecf3';
      return `<button class="nb${cur===k?' on':''}" style="--c:${c}" data-act="go" data-to="${k}">${l}</button>`; }).join('');
}
function home(){
  let h = `<div class="hero"><h1>Geometry Test Study Guide</h1><p>Sections 1.1 to 1.4, built from your class notes, stations, and homework. Every problem shows how to get the answer.</p></div>
  <div class="howto"><div><b>1. Learn it</b><span>Short lessons with a check-in after each idea.</span></div>
  <div><b>2. Practice it</b><span>Problems from class. Check your answer, then see the steps.</span></div>
  <div><b>3. Test yourself</b><span>3 practice tests that tell you which section to review.</span></div></div>
  <div class="seccards">`;
  D.sections.forEach((s, i) => { const st = secStats(i);
    h += `<button class="sc" style="--c:${s.color}" data-act="go" data-to="sec${i}"><div class="id">${s.id}</div><h3>${s.title}</h3><p>${s.blurb}</p>
    <div class="bar"><i style="width:${st.total ? 100*st.solved/st.total : 0}%"></i></div><div class="small">${st.solved} of ${st.total} practice problems solved</div></button>`; });
  h += `</div><div class="wide">
    <button class="sc" style="--c:#facc15" data-act="go" data-to="flash"><h3>🃏 Flashcards</h3><p>${D.flash.length} key terms. Tap to flip.</p></button>
    <button class="sc" style="--c:#f472b6" data-act="go" data-to="tests"><h3>📝 Practice Tests</h3><p>3 tests, 20 questions each, with full solutions.</p></button></div>`;
  return h;
}
function section(){
  const s = D.sections[S.sec], si = S.sec;
  const np = s.sets.reduce((a, st) => a + st.probs.length, 0);
  let h = `<div style="--c:${s.color}"><div class="sechead"><div class="id">Section ${s.id}</div><h2>${s.title}</h2></div>
  <div class="tabs"><button class="tab${S.tab==='learn'?' on':''}" data-act="tab" data-t="learn">1. Learn it</button>
  <button class="tab${S.tab==='practice'?' on':''}" data-act="tab" data-t="practice">2. Practice problems (${np})</button></div>`;
  if (S.tab === 'learn'){
    s.topics.forEach((t, ti) => {
      h += `<div class="topic"><h3><span class="n">${ti+1}/${s.topics.length}</span>${t.h}</h3><div class="content">${t.body}</div>${cardHTML(`c${si}_${ti}`)}</div>`;
    });
    h += `<div class="navrow"><span></span><button class="btn" data-act="tab" data-t="practice">Next: practice problems</button></div>`;
  } else {
    s.sets.forEach((st, a) => {
      h += `<div class="setbox"><h3>${st.title}</h3>${st.note ? `<div class="setnote">${st.note}</div>` : ''}`;
      st.probs.forEach((p, b) => { h += cardHTML(`p${si}_${a}_${b}`); });
      h += `</div>`;
    });
    const nx = si < D.sections.length - 1 ? `<button class="btn" data-act="go" data-to="sec${si+1}">Next: ${D.sections[si+1].id}</button>` : `<button class="btn" data-act="go" data-to="tests">Next: practice tests</button>`;
    h += `<div class="navrow"><button class="btn ghost" data-act="tab" data-t="learn">Back to lessons</button>${nx}</div>`;
  }
  return h + '</div>';
}
function testScore(ti){
  const qs = D.tests[ti].qs; let ans = 0, ok = 0;
  qs.forEach((q, qi) => { const r = R[`t${ti}_${qi}`]; if (r && r.locked){ ans++; if (r.correct) ok++; } });
  return {ans, ok, n: qs.length};
}
function tests(){
  let h = `<div class="hero"><h1>Practice Tests</h1><p>Each test mixes all four sections, 5 questions each. You get one try per question, then the steps appear. At the end you'll see which section to review.</p></div><div class="testlist">`;
  D.tests.forEach((t, i) => { const sc = testScore(i);
    h += `<button class="sc" style="--c:#f472b6" data-act="test" data-t="${i}"><h3>${t.name}</h3><p>${sc.ans ? `${sc.ok} correct out of ${sc.ans} answered` : 'Not started'}</p></button>`; });
  return h + '</div>';
}
function updateScore(){
  const el = document.getElementById('score'); if (!el) return;
  const sc = testScore(S.test); el.textContent = `${sc.ok} / ${sc.ans} correct · ${sc.n - sc.ans} left`;
  const fin = document.getElementById('finish'); if (fin) fin.style.display = sc.ans === sc.n ? 'inline-block' : 'none';
}
function test(){
  const t = D.tests[S.test];
  let h = `<div style="--c:#f472b6"><div class="sechead"><div class="id">Practice test</div><h2>${t.name}</h2></div>
  <div class="scorebar"><b id="score"></b><div class="btnrow"><button class="btn ghost" data-act="reset" data-t="${S.test}">Start over</button></div></div>`;
  t.qs.forEach((q, qi) => { h += cardHTML(`t${S.test}_${qi}`, qi+1); });
  h += `<div class="btnrow"><button class="btn" id="finish" data-act="finish" style="display:none">See my results</button></div><div id="res"></div>`;
  h += `<div class="navrow"><button class="btn ghost" data-act="go" data-to="tests">All tests</button>${S.test < D.tests.length-1 ? `<button class="btn" data-act="test" data-t="${S.test+1}">Next test</button>` : ''}</div></div>`;
  return h;
}
function results(){
  const t = D.tests[S.test], by = {};
  t.qs.forEach((q, qi) => { const r = R[`t${S.test}_${qi}`] || {}; by[q.sec] = by[q.sec] || [0,0]; by[q.sec][1]++; if (r.correct) by[q.sec][0]++; });
  const sc = testScore(S.test), pct = Math.round(100 * sc.ok / sc.n);
  let h = `<div class="result"><h3>${pct >= 90 ? '🎉 Ready for the test!' : pct >= 70 ? '📚 Almost there!' : '💪 Keep practicing!'}</h3><p>You got <b>${sc.ok} out of ${sc.n}</b> (${pct}%).</p>`;
  Object.keys(by).sort().forEach(k => { const [a,b] = by[k];
    h += `<div class="rrow"><span>Section ${k}</span><span>${a}/${b} ${a < b-1 ? `<button class="btn ghost" style="padding:3px 10px;margin-left:8px" data-act="go" data-to="sec${D.sections.findIndex(s=>s.id===k)}">Review ${k}</button>` : a === b ? '✅' : ''}</span></div>`; });
  return h + '</div>';
}
function flash(){
  let h = `<div class="hero"><h1>Flashcards</h1><p>Say the definition out loud, then tap the card to check.</p></div><div class="fchips">`;
  ['all', ...D.sections.map(s => s.id)].forEach(k => { h += `<button class="nb${S.fsec===k?' on':''}" style="--c:${COL[k]||'#e9ecf3'}" data-act="fsec" data-k="${k}">${k==='all'?'All':k}</button>`; });
  h += `</div><div class="fgrid">`;
  D.flash.forEach((f, i) => { if (S.fsec !== 'all' && f.sec !== S.fsec) return;
    h += `<button class="fc" style="--c:${COL[f.sec]}" data-act="flip"><div class="in"><div class="fa"><b>${f.term}</b><span>${f.sec} · tap to flip</span></div><div class="fb2">${f.def_}</div></div></button>`; });
  return h + '</div>';
}
function render(scroll){
  nav();
  const m = document.getElementById('main');
  m.innerHTML = S.view === 'home' ? home() : S.view === 'sec' ? section() : S.view === 'tests' ? tests() : S.view === 'test' ? test() : flash();
  if (S.view === 'test') updateScore();
  if (scroll !== false) window.scrollTo(0, 0);
}

// ---------- actions (event delegation, no inline handlers) ----------
function checkNum(id){
  const {p, mode} = P[id];
  const vals = p.fields.map((f, fi) => document.getElementById(`${id}_${fi}`).value);
  const marks = p.fields.map((f, fi) => matches(vals[fi], f.acc));
  const all = marks.every(Boolean);
  const r = R[id] = Object.assign(R[id] || {}, {vals, marks});
  if (mode === 'test'){ r.locked = true; r.correct = all; }
  else if (all){ r.locked = true; r.correct = true; }
  refresh(id, mode === 'test' ? +id.split('_')[1] + 1 : undefined);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'go'){ const to = b.dataset.to;
    if (to.startsWith('sec')){ S.view = 'sec'; S.sec = +to.slice(3); S.tab = 'learn'; } else S.view = to; render(); }
  else if (a === 'tab'){ S.tab = b.dataset.t; render(); }
  else if (a === 'test'){ S.view = 'test'; S.test = +b.dataset.t; render(); }
  else if (a === 'mc'){ const {p, mode} = P[id]; if (R[id] && R[id].locked) return;
    const i = +b.dataset.i; R[id] = Object.assign(R[id] || {}, {locked:true, chosen:i, correct: i === p.ans});
    refresh(id, mode === 'test' ? +id.split('_')[1] + 1 : undefined); }
  else if (a === 'check') checkNum(id);
  else if (a === 'peek'){ R[id] = Object.assign(R[id] || {}, {peek:true}); refresh(id); }
  else if (a === 'reset'){ const t = +b.dataset.t; Object.keys(R).forEach(k => { if (k.startsWith(`t${t}_`)) delete R[k]; }); render(); }
  else if (a === 'finish'){ document.getElementById('res').innerHTML = results(); document.getElementById('res').scrollIntoView({behavior:'smooth'}); }
  else if (a === 'fsec'){ S.fsec = b.dataset.k; render(false); }
  else if (a === 'flip'){ b.classList.toggle('flip'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.fld input')) checkNum(e.target.dataset.id);
});
render();
</script>
</body>
</html>
